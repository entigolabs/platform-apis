---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: pginstances.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: PostgreSQLInstance
    plural: pginstances
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the cloud block's id, and never
                  changes or deletes it. Every other field is then rejected (rule 9). Set at
                  creation only.
              version:
                type: string
                description: |-
                  The major version, such as "17". With maintenance.autoMinorVersionUpgrade false,
                  the full version, such as "17.7".
                  Ignored for a full version on GCP, OCI and Azure, which keep the minor current.
                  Default: per deployment.
                pattern: ^[0-9]+(\.[0-9]+)?$
              storage:
                type: object
                properties:
                  sizeGB:
                    type: integer
                    description: |-
                      Disk size in GB at creation, and its floor after: raising it grows the disk,
                      lowering it is rejected. The disk can be larger: it is rounded up to a size the
                      cloud accepts, and autoGrow can take it further. The status shows the real size.
                      Default: per deployment.
                    minimum: 1
                    x-kubernetes-validations:
                    - rule: self >= oldSelf
                      message: storage.sizeGB cannot decrease
                  autoGrow:
                    type: boolean
                    description: |-
                      Grow the disk as it fills.
                      Ignored for false on OCI, whose storage always grows.
                      Default: fixed, true.
                  maxSizeGB:
                    type: integer
                    description: |-
                      The size autoGrow stops at.
                      Ignored on OCI and Azure.
                      Default: per deployment.
                    minimum: 1
                  iops:
                    type: integer
                    description: |-
                      Provisioned IOPS.
                      Ignored on Azure, and on GCP without Hyperdisk.
                    minimum: 1
                  throughputMBps:
                    type: integer
                    description: |-
                      Provisioned throughput in MB/s.
                      Ignored on OCI, Azure, and GCP without Hyperdisk.
                    minimum: 1
                x-kubernetes-validations:
                - rule: |-
                    !has(self.maxSizeGB)
                    || !has(self.sizeGB)
                    || self.maxSizeGB >= self.sizeGB
                  message: maxSizeGB must be at least sizeGB
              highAvailability:
                type: boolean
                description: |-
                  A standby in another zone, with automatic failover.
                  Default: per deployment.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              maintenance:
                type: object
                properties:
                  window:
                    type: object
                    description: |-
                      The weekly hour, in UTC, in which the cloud applies updates.
                    properties:
                      day:
                        type: string
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                      hourUTC:
                        type: integer
                        minimum: 0
                        maximum: 23
                    required:
                    - day
                    - hourUTC
                  autoMinorVersionUpgrade:
                    type: boolean
                    description: |-
                      Apply new minor versions in the maintenance window. false keeps the minor
                      written in version.
                      Ignored for false on GCP, OCI and Azure.
                      Default: per deployment.
                  allowMajorVersionUpgrade:
                    type: boolean
                    description: |-
                      Allow version to change to a later major.
                      A major upgrade on OCI, which has none, fails (rule 10).
                      Default: fixed, false.
              backup:
                type: object
                properties:
                  retentionDays:
                    type: integer
                    description: |-
                      Days automated backups are kept, within the cloud's own range, which the cloud
                      checks (rule 10). 0 turns automated backups and point-in-time restore off.
                      Ignored for 0 on Azure, which always keeps backups.
                      Default: per deployment.
                    minimum: 0
                  pointInTimeDays:
                    type: integer
                    description: |-
                      Days back restore.pointInTime can reach, within the cloud's own range. AWS and
                      Azure keep one window for both, so above retentionDays is rejected there.
                      Default: fixed, the lower of retentionDays and the cloud's maximum; none with retentionDays 0.
                    minimum: 1
                  startHourUTC:
                    type: integer
                    description: |-
                      The hour, in UTC, the daily backup starts.
                      Ignored on Azure.
                    minimum: 0
                    maximum: 23
                x-kubernetes-validations:
                - rule: |-
                    !has(self.pointInTimeDays)
                    || !has(self.retentionDays)
                    || self.retentionDays > 0
                  message: pointInTimeDays needs backups, which retentionDays 0 disables
              parameters:
                type: object
                description: |-
                  PostgreSQL settings, by name. Keys outside the cloud's allowlist are rejected.
                additionalProperties:
                  type: string
              parameterApplyMethod:
                type: string
                description: |-
                  When changed parameters take effect. Immediate restarts the instance where a
                  setting needs it; RDS rejects such settings with Immediate.
                  Ignored for NextRestart on GCP, OCI and Azure, where a change that needs a
                  restart restarts the instance at once.
                  Default: fixed, Immediate.
                enum:
                - Immediate
                - NextRestart
              restore:
                type: object
                description: |-
                  Create the instance from another instance's backups. Create time only.
                properties:
                  fromInstance:
                    type: string
                    description: |-
                      A PostgreSQLInstance in this namespace.
                  pointInTime:
                    type: string
                    description: |-
                      The time to restore fromInstance to. Unset, the latest restorable time.
                    format: date-time
                required:
                - fromInstance
              secretName:
                type: string
                description: |-
                  The name of the connection Secret (rule 6). The platform never overwrites a
                  Secret that another object or person owns; set this to avoid one.
                  Default: fixed, <instance>-dbadmin.
              aws:
                type: object
                description: |-
                  Settings for AWS only (rule 2).
                properties:
                  id:
                    type: string
                    description: |-
                      The AWS ID of an existing database instance to observe (rule 9). Only with
                      observe.
                    x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: id is immutable
                  instanceType:
                    type: string
                    description: |-
                      The RDS instance class, such as db.t4g.small.
                      Default: per deployment.
                  parameterGroupName:
                    type: string
                    description: |-
                      An existing RDS parameter group to use, in place of parameters.
                  fromBackup:
                    type: string
                    description: |-
                      An RDS snapshot ID to create the instance from. Create time only; not with
                      restore.
              gcp:
                type: object
                description: |-
                  Settings for GCP only (rule 2).
                properties:
                  id:
                    type: string
                    description: |-
                      The GCP ID of an existing database instance to observe (rule 9). Only with
                      observe.
                    x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: id is immutable
                  instanceType:
                    type: string
                    description: |-
                      The Cloud SQL machine tier, such as db-custom-2-7680, which belongs to
                      gcp.edition.
                      Default: per deployment.
                  edition:
                    type: string
                    description: |-
                      Cloud SQL edition, such as ENTERPRISE.
                      Default: per deployment.
                  diskType:
                    type: string
                    description: |-
                      Cloud SQL disk type, such as PD_SSD.
                      Default: per deployment.
                  fromBackup:
                    type: string
                    description: |-
                      A Cloud SQL backup to create the instance from, as <instance>/<backup run ID>.
                      Create time only; not with restore.
              oci:
                type: object
                description: |-
                  Settings for OCI only (rule 2).
                properties:
                  id:
                    type: string
                    description: |-
                      The OCI ID of an existing database instance to observe (rule 9). Only with
                      observe.
                    x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: id is immutable
                  instanceType:
                    type: string
                    description: |-
                      The DB system shape. A .Flex shape needs oci.ocpus and oci.memoryGB.
                      Default: per deployment.
                  ocpus:
                    type: number
                    description: |-
                      Required with a .Flex shape.
                      Default: per deployment.
                    minimum: 1
                  memoryGB:
                    type: integer
                    description: |-
                      Required with a .Flex shape.
                      Default: per deployment.
                    minimum: 1
                  fromBackup:
                    type: string
                    description: |-
                      A DB system backup OCID to create the instance from. Create time only; not with
                      restore.
              azure:
                type: object
                description: |-
                  Settings for Azure only (rule 2).
                properties:
                  id:
                    type: string
                    description: |-
                      The Azure ID of an existing database instance to observe (rule 9). Only with
                      observe.
                    x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: id is immutable
                  instanceType:
                    type: string
                    description: |-
                      The flexible server SKU, such as GP_Standard_D2ds_v5.
                      Default: per deployment.
                  storageTier:
                    type: string
                    description: |-
                      The disk tier, such as P10, which sets its IOPS.
                      Default: per deployment.
            x-kubernetes-validations:
            - rule: |-
                [(has(self.aws) && has(self.aws.id)), (has(self.gcp) && has(self.gcp.id)), (has(self.oci) && has(self.oci.id)), (has(self.azure) && has(self.azure.id))].filter(b, b).size() <= 1
              message: at most one cloud block may hold an id
            - rule: |-
                (has(self.observe) && self.observe) == ((has(self.aws) && has(self.aws.id)) || (has(self.gcp) && has(self.gcp.id)) || (has(self.oci) && has(self.oci.id)) || (has(self.azure) && has(self.azure.id)))
              message: observe and the cloud block's id go together
            - rule: |-
                (has(self.observe) && self.observe) == (has(oldSelf.observe) && oldSelf.observe)
              message: observe is immutable
            - rule: |-
                has(self.restore) == has(oldSelf.restore) && (!has(self.restore) || self.restore == oldSelf.restore)
              message: restore is set at creation only
            - rule: |-
                !has(self.version)
                || !has(oldSelf.version)
                || self.version.split('.')[0] == oldSelf.version.split('.')[0]
                || (has(self.maintenance) && has(self.maintenance.allowMajorVersionUpgrade) && self.maintenance.allowMajorVersionUpgrade)
              message: a major version change needs maintenance.allowMajorVersionUpgrade
            - rule: |-
                (has(self.aws) && has(self.aws.fromBackup)) == (has(oldSelf.aws) && has(oldSelf.aws.fromBackup)) && (!(has(self.aws) && has(self.aws.fromBackup)) || self.aws.fromBackup == oldSelf.aws.fromBackup)
              message: aws.fromBackup is set at creation only
            - rule: "!(has(self.aws) && has(self.aws.fromBackup)) || !has(self.restore)"
              message: aws.fromBackup cannot be combined with restore
            - rule: |-
                (has(self.gcp) && has(self.gcp.fromBackup)) == (has(oldSelf.gcp) && has(oldSelf.gcp.fromBackup)) && (!(has(self.gcp) && has(self.gcp.fromBackup)) || self.gcp.fromBackup == oldSelf.gcp.fromBackup)
              message: gcp.fromBackup is set at creation only
            - rule: "!(has(self.gcp) && has(self.gcp.fromBackup)) || !has(self.restore)"
              message: gcp.fromBackup cannot be combined with restore
            - rule: |-
                (has(self.oci) && has(self.oci.fromBackup)) == (has(oldSelf.oci) && has(oldSelf.oci.fromBackup)) && (!(has(self.oci) && has(self.oci.fromBackup)) || self.oci.fromBackup == oldSelf.oci.fromBackup)
              message: oci.fromBackup is set at creation only
            - rule: "!(has(self.oci) && has(self.oci.fromBackup)) || !has(self.restore)"
              message: oci.fromBackup cannot be combined with restore
            - rule: |-
                !has(self.aws)
                || !has(self.aws.parameterGroupName)
                || !has(self.parameters)
              message: aws.parameterGroupName and parameters cannot be used together
            - rule: |-
                !has(oldSelf.aws)
                || !has(oldSelf.aws.parameterGroupName)
                || !has(self.version)
                || !has(oldSelf.version)
                || self.version.split('.')[0] == oldSelf.version.split('.')[0]
                || !has(self.aws)
                || !has(self.aws.parameterGroupName)
                || self.aws.parameterGroupName != oldSelf.aws.parameterGroupName
              message: a major version change needs a new aws.parameterGroupName, since a parameter group
                fits one major version
            - rule: |-
                !has(self.version)
                || self.version.contains('.') == (has(self.maintenance) && has(self.maintenance.autoMinorVersionUpgrade) && !self.maintenance.autoMinorVersionUpgrade)
              message: version takes a minor exactly when maintenance.autoMinorVersionUpgrade is false
          status:
            type: object
            properties:
              version:
                type: string
              storage:
                type: object
                properties:
                  sizeGB:
                    type: integer
                    description: |-
                      The actual disk size.
                  autoGrow:
                    type: boolean
                  maxSizeGB:
                    type: integer
                  iops:
                    type: integer
                  throughputMBps:
                    type: integer
              highAvailability:
                type: boolean
              maintenance:
                type: object
                properties:
                  window:
                    type: object
                    properties:
                      day:
                        type: string
                      hourUTC:
                        type: integer
                  autoMinorVersionUpgrade:
                    type: boolean
              backup:
                type: object
                properties:
                  retentionDays:
                    type: integer
                  pointInTimeDays:
                    type: integer
                  startHourUTC:
                    type: integer
              endpoint:
                type: object
                description: |-
                  The address applications connect to.
                properties:
                  host:
                    type: string
                  port:
                    type: integer
              connectionSecret:
                type: string
                description: |-
                  The admin Secret, <instance>-dbadmin (rule 6).
              aws:
                type: object
                properties:
                  instanceType:
                    type: string
                  finalBackup:
                    type: string
                    description: |-
                      The ID the final snapshot receives when the instance is deleted, for
                      aws.fromBackup.
                  identifier:
                    type: string
                  resourceId:
                    type: string
                  engineVersionActual:
                    type: string
                  latestRestorableTime:
                    type: string
                    format: date-time
                  status:
                    type: string
              gcp:
                type: object
                properties:
                  instanceType:
                    type: string
                  id:
                    type: string
                  connectionName:
                    type: string
                  maintenanceVersion:
                    type: string
              oci:
                type: object
                properties:
                  instanceType:
                    type: string
                  id:
                    type: string
                  instanceOcpuCount:
                    type: number
                  instanceMemorySizeInGbs:
                    type: integer
                  state:
                    type: string
              azure:
                type: object
                properties:
                  instanceType:
                    type: string
                  id:
                    type: string
        required:
        - spec
