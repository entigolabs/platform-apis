---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mariadbrdsconfigs.aws.database.entigo.com
spec:
  group: aws.database.entigo.com
  scope: Namespaced
  names:
    kind: MariaDBRDSConfig
    plural: mariadbrdsconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Amazon RDS (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Amazon RDS ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
              instanceType:
                type: string
                description: |-
                  The RDS instance class, such as db.t4g.small.
                  Default: the class's template.
              parameterGroupName:
                type: string
                description: |-
                  An existing RDS parameter group to use, in place of the object's parameters. A
                  major version change needs a new one, since a group fits one major version.
              fromBackup:
                type: string
                description: |-
                  An RDS snapshot ID to create the server from, such as
                  status.provider.finalBackup of a deleted server. Set at creation only; not with
                  restore.
              minorVersion:
                type: string
                description: |-
                  The full version to stay on, such as "11.4.10", which turns automatic minor
                  upgrades off; its major must be the server's version. Unset, RDS applies minor
                  versions in the maintenance window.
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
              maxSizeGB:
                type: integer
                description: |-
                  The size storage autoscaling stops at. Unset, the implementation's ceiling.
                minimum: 1
              iops:
                type: integer
                description: |-
                  Provisioned IOPS. Only from 400 GiB of disk.
                minimum: 1
              throughputMBps:
                type: integer
                description: |-
                  Provisioned throughput in MB/s. Only from 400 GiB of disk.
                minimum: 1
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
              backupStartHourUTC:
                type: integer
                description: |-
                  The hour, in UTC, the daily backup starts. Unset, the backend picks it.
                minimum: 0
                maximum: 23
              parameterApplyMethod:
                type: string
                description: |-
                  The moment changed parameters take effect. Immediate restarts the instance where
                  a setting needs it.
                  Default: fixed, Immediate.
                enum:
                - Immediate
                - NextRestart
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
            - rule: |-
                has(self.fromBackup) == has(oldSelf.fromBackup) && (!has(self.fromBackup) || self.fromBackup == oldSelf.fromBackup)
              message: fromBackup is set at creation only
          status:
            type: object
            description: |-
              The shape of status.provider for Amazon RDS (principle 4).
            properties:
              instanceType:
                type: string
              finalBackup:
                type: string
                description: |-
                  The ID the final backup receives when the server is deleted, for fromBackup.
              state:
                type: string
              identifier:
                type: string
              resourceId:
                type: string
              engineVersionActual:
                type: string
              latestRestorableTime:
                type: string
                format: date-time
        required:
        - spec
    subresources:
      status: {}
