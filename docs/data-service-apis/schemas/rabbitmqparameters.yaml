---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqparameters.mq.entigo.com
spec:
  group: mq.entigo.com
  scope: Namespaced
  names:
    kind: RabbitMQParameters
    plural: rabbitmqparameters
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                description: |-
                  rabbitmq.conf settings, by name. Keys outside the backend's allowlist are
                  rejected by the cloud (principle 10).
                additionalProperties:
                  type: string
            required:
            - parameters
        required:
        - spec
