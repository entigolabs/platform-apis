---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqlcloudsqlconfigs.gcp.database.entigo.com
spec:
  group: gcp.database.entigo.com
  scope: Namespaced
  names:
    kind: PostgreSQLCloudSQLConfig
    plural: postgresqlcloudsqlconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Cloud SQL (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Cloud SQL ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
              instanceType:
                type: string
                description: |-
                  The Cloud SQL machine tier, such as db-custom-2-7680, which belongs to edition.
                  Default: the class's template, else the implementation's.
              edition:
                type: string
                description: |-
                  The Cloud SQL edition, such as ENTERPRISE.
                  Default: the class's template, else the implementation's.
              diskType:
                type: string
                description: |-
                  The Cloud SQL disk type, such as PD_SSD.
                  Default: the class's template, else the implementation's.
              fromBackup:
                type: string
                description: |-
                  A Cloud SQL backup to create the cluster from, as <instance>/<backup run ID>.
                  Set at creation only; not with restore.
              autoGrow:
                type: boolean
                description: |-
                  Grow the disk as it fills.
                  Default: fixed, true.
              maxSizeGB:
                type: integer
                description: |-
                  The size autoGrow stops at. Unset, no ceiling.
                minimum: 1
              iops:
                type: integer
                description: |-
                  Provisioned IOPS. Only with Hyperdisk.
                minimum: 1
              throughputMBps:
                type: integer
                description: |-
                  Provisioned throughput in MB/s. Only with Hyperdisk.
                minimum: 1
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
              pointInTimeDays:
                type: integer
                description: |-
                  Days back restore.pointInTime can reach, at most the cluster's
                  backup.retentionDays. Unset, 7.
                minimum: 1
              backupStartHourUTC:
                type: integer
                description: |-
                  The hour, in UTC, the daily backup starts. Unset, the backend picks it.
                minimum: 0
                maximum: 23
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
            - rule: |-
                has(self.fromBackup) == has(oldSelf.fromBackup) && (!has(self.fromBackup) || self.fromBackup == oldSelf.fromBackup)
              message: fromBackup is set at creation only
          status:
            type: object
            description: |-
              The shape of status.provider for Cloud SQL (principle 4).
            properties:
              instanceType:
                type: string
              finalBackup:
                type: string
                description: |-
                  The ID the final backup receives when the cluster is deleted, for fromBackup.
              state:
                type: string
              id:
                type: string
              connectionName:
                type: string
              maintenanceVersion:
                type: string
        required:
        - spec
    subresources:
      status: {}
