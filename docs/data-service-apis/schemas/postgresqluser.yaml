---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqlusers.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: PostgreSQLUser
    plural: postgresqlusers
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
                description: |-
                  The role's name in the engine, which may hold what a Kubernetes name cannot.
                  Unset, metadata.name. Set at creation only.
              clusterRef:
                type: object
                description: |-
                  The PostgreSQLCluster this object lives in.
                properties:
                  name:
                    type: string
                    description: |-
                      The PostgreSQLCluster.
                  namespace:
                    type: string
                    description: |-
                      The PostgreSQLCluster's namespace, which must be in this object's Zone
                      (principle 11). Unset, this object's namespace.
                  kind:
                    type: string
                    description: |-
                      Set to PostgreSQLInstance while the parent is still today's PostgreSQLInstance,
                      so this object keeps today's behaviour; unset, a PostgreSQLCluster. It can be
                      removed once, when the parent moves to a PostgreSQLCluster.
                    enum:
                    - PostgreSQLInstance
                required:
                - name
                x-kubernetes-validations:
                - rule: self == oldSelf || (has(oldSelf.kind) && !has(self.kind))
                  message: clusterRef is immutable, except that kind can be removed once
              secretName:
                type: string
                description: |-
                  The name of the connection Secret (principle 6). The platform never overwrites a
                  Secret that another object or person owns; set this to avoid one.
                  Default: fixed, <instance>-<user>.
              login:
                type: boolean
                description: |-
                  The role can log in.
                  Default: fixed, true.
              createDb:
                type: boolean
                description: |-
                  The role can create databases.
                  Default: fixed, false.
              createRole:
                type: boolean
                description: |-
                  The role can create roles.
                  Default: fixed, false.
              inherit:
                type: boolean
                description: |-
                  The role inherits the privileges of roles it is granted.
                  Default: fixed, true.
              grant:
                type: object
                properties:
                  roles:
                    type: array
                    description: |-
                      Roles granted to this role.
                    items:
                      type: string
            x-kubernetes-validations:
            - rule: |-
                (has(self.name) ? self.name : '') == (has(oldSelf.name) ? oldSelf.name : '')
              message: name is immutable
            required:
            - clusterRef
          status:
            type: object
            properties:
              connectionSecret:
                type: string
                description: |-
                  The Secret with this user's login (principle 6).
        required:
        - spec
