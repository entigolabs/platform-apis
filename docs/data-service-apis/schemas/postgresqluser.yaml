---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqlusers.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: PostgreSQLUser
    plural: postgresqlusers
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
                description: |-
                  The role's name in the engine, which may hold what a Kubernetes name cannot.
                  Unset, metadata.name. Set at creation only.
              instanceRef:
                type: object
                description: |-
                  The PostgreSQLInstance this object lives in.
                properties:
                  name:
                    type: string
                    description: |-
                      The PostgreSQLInstance.
                  namespace:
                    type: string
                    description: |-
                      The PostgreSQLInstance's namespace, which must be in this object's Zone (rule
                      11). Unset, this object's namespace.
                required:
                - name
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: instanceRef is immutable
              secretName:
                type: string
                description: |-
                  The name of the connection Secret (rule 6). The platform never overwrites a
                  Secret that another object or person owns; set this to avoid one.
                  Default: fixed, <instance>-<user>.
              login:
                type: boolean
                description: |-
                  The role can log in.
                  Default: fixed, true.
              createDb:
                type: boolean
                description: |-
                  The role can create databases.
                  Default: fixed, false.
              createRole:
                type: boolean
                description: |-
                  The role can create roles.
                  Default: fixed, false.
              inherit:
                type: boolean
                description: |-
                  The role inherits the privileges of roles it is granted.
                  Default: fixed, true.
              grant:
                type: object
                properties:
                  roles:
                    type: array
                    description: |-
                      Roles granted to this role.
                    items:
                      type: string
            x-kubernetes-validations:
            - rule: |-
                (has(self.name) ? self.name : '') == (has(oldSelf.name) ? oldSelf.name : '')
              message: name is immutable
            required:
            - instanceRef
          status:
            type: object
            properties:
              connectionSecret:
                type: string
                description: |-
                  The Secret with this user's login (rule 6).
        required:
        - spec
