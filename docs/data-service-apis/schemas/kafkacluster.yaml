---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: kafkaclusters.queue.entigo.com
spec:
  group: queue.entigo.com
  scope: Namespaced
  names:
    kind: KafkaCluster
    plural: kafkaclusters
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              className:
                type: string
                description: |-
                  The KafkaClass: the deployment's defaults, enforced values and implementation
                  (principle 5). Unset, the default class. Set at creation only.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: className is immutable
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the id in its provider
                  configuration entry, and never changes or deletes it. Every other common field
                  is then rejected (principle 9). Set at creation only.
              version:
                type: string
                description: |-
                  The Kafka version, such as "4.0". Each implementation accepts the versions it
                  offers (principle 10).
                  Default: the class's template.
              brokers:
                type: integer
                description: |-
                  The number of brokers.
                  Default: the class's template.
                minimum: 1
              storage:
                type: object
                properties:
                  sizeGB:
                    type: integer
                    description: |-
                      Disk per broker, in GB.
                      Default: the class's template.
                    minimum: 1
              highAvailability:
                type: boolean
                description: |-
                  Survive the loss of one zone. Refused where the class does not support
                  HighAvailability (principle 1).
                  Default: the class's template.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              parametersRef:
                type: object
                description: |-
                  Reusable broker settings, merged after the class's.
                properties:
                  name:
                    type: string
                    description: |-
                      A KafkaParameters in this namespace.
                required:
                - name
              parameters:
                type: object
                description: |-
                  Broker settings for this object only, merged after parametersRef.
                additionalProperties:
                  type: string
              providerConfigs:
                type: array
                description: |-
                  Settings of single implementations, one entry per kind (principle 2). The
                  deployment applies the entry whose kind its class names and ignores the others.
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      description: |-
                        The provider configuration kind's group and version, such as
                        aws.database.entigo.com/v1alpha1.
                    kind:
                      type: string
                      description: |-
                        The provider configuration kind, such as PostgreSQLRDSConfig.
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        The settings, checked by the implementation that applies them (principle 10).
                    ref:
                      type: object
                      description: |-
                        The settings in a separate object of this kind, instead of spec.
                      properties:
                        name:
                          type: string
                          description: |-
                            An object of this kind in the same namespace.
                      required:
                      - name
                  required:
                  - apiVersion
                  - kind
                  x-kubernetes-validations:
                  - rule: has(self.spec) != has(self.ref)
                    message: an entry holds either spec or ref
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
            x-kubernetes-validations:
            - rule: |-
                (has(self.observe) && self.observe) == (has(oldSelf.observe) && oldSelf.observe)
              message: observe is immutable
            - rule: |-
                !(has(self.observe) && self.observe)
                || (!has(self.version) && !has(self.brokers) && !has(self.storage) && !has(self.highAvailability) && !has(self.deletionProtection) && !has(self.parametersRef) && !has(self.parameters))
              message: an observed resource takes no other common field
          status:
            type: object
            properties:
              version:
                type: string
              brokers:
                type: integer
              storage:
                type: object
                properties:
                  sizeGB:
                    type: integer
              highAvailability:
                type: boolean
              bootstrapServers:
                type: string
                description: |-
                  The listener applications connect to, as host:port pairs.
              providerConfig:
                type: object
                description: |-
                  The provider configuration entries applied and ignored, as <apiVersion>, <kind>
                  (principle 4).
                properties:
                  applied:
                    type: string
                  ignored:
                    type: array
                    items:
                      type: string
              effective:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Each effective value and its source: the class's template, the object, or the
                  class's enforced (principle 4).
              provider:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values of the applied implementation, in the shape its provider configuration
                  kind's status defines (principle 4).
        required:
        - spec
