---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: mariadbdatabases.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: MariaDBDatabase
    plural: mariadbdatabases
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
                description: |-
                  The database's name in the engine, which may hold what a Kubernetes name cannot.
                  Unset, metadata.name. Set at creation only.
              serverRef:
                type: object
                description: |-
                  The MariaDBServer this object lives in.
                properties:
                  name:
                    type: string
                    description: |-
                      The MariaDBServer.
                  namespace:
                    type: string
                    description: |-
                      The MariaDBServer's namespace, which must be in this object's Zone (principle
                      11). Unset, this object's namespace.
                  kind:
                    type: string
                    description: |-
                      Set to MariaDBInstance while the parent is still today's MariaDBInstance, so
                      this object keeps today's behaviour; unset, a MariaDBServer. It can be removed
                      once, when the parent moves to a MariaDBServer.
                    enum:
                    - MariaDBInstance
                required:
                - name
                x-kubernetes-validations:
                - rule: self == oldSelf || (has(oldSelf.kind) && !has(self.kind))
                  message: serverRef is immutable, except that kind can be removed once
              defaultCharacterSet:
                type: string
                description: |-
                  The default character set.
              defaultCollation:
                type: string
                description: |-
                  The default collation.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
            x-kubernetes-validations:
            - rule: |-
                (has(self.name) ? self.name : '') == (has(oldSelf.name) ? oldSelf.name : '')
              message: name is immutable
            required:
            - serverRef
          status:
            type: object
            properties: {}
        required:
        - spec
