---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkamskconfigs.aws.queue.entigo.com
spec:
  group: aws.queue.entigo.com
  scope: Namespaced
  names:
    kind: KafkaMSKConfig
    plural: kafkamskconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Amazon MSK (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Amazon MSK ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: id is immutable
              instanceType:
                type: string
                description: |-
                  The MSK broker instance type, such as kafka.m7g.large.
                  Default: the class's template.
          status:
            type: object
            description: |-
              The shape of status.provider for Amazon MSK (principle 4).
            properties:
              instanceType:
                type: string
              arn:
                type: string
              kafkaVersion:
                type: string
        required:
        - spec
    subresources:
      status: {}
