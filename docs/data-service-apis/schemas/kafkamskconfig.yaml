---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkamskconfigs.aws.queue.entigo.com
spec:
  group: aws.queue.entigo.com
  scope: Namespaced
  names:
    kind: KafkaMSKConfig
    plural: kafkamskconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Amazon MSK (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Amazon MSK ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
              instanceType:
                type: string
                description: |-
                  The MSK broker instance type, such as kafka.m7g.large.
                  Default: the class's template, else the implementation's.
              brokers:
                type: integer
                description: |-
                  The number of brokers.
                  Default: the class's template, else the implementation's.
                minimum: 1
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Amazon MSK (principle 4).
            properties:
              instanceType:
                type: string
              brokers:
                type: integer
              arn:
                type: string
              kafkaVersion:
                type: string
        required:
        - spec
    subresources:
      status: {}
