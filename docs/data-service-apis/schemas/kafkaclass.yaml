---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkaclasses.queue.entigo.com
spec:
  group: queue.entigo.com
  scope: Cluster
  names:
    kind: KafkaClass
    plural: kafkaclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  version: &id001
                    type: string
                    description: |-
                      The Kafka version, such as "4.0". Each backend accepts the versions it offers
                      (principle 10).
                      Default: the class's template, else the implementation's.
                  storage: &id002
                    type: object
                    properties:
                      sizeGB:
                        type: integer
                        description: |-
                          Disk per broker, in GB.
                          Default: the class's template, else the implementation's.
                        minimum: 1
                  highAvailability: &id003
                    type: boolean
                    description: |-
                      Survive the loss of one zone. Refused where the backend does not support
                      HighAvailability (principle 1).
                      Default: the class's template, else the implementation's.
                  deletionProtection: &id004
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  parameters: &id005
                    type: object
                    description: |-
                      Broker settings for this object only, merged after parametersRefs.
                    additionalProperties:
                      type: string
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the backend this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Applied from creation and at each class sync; an object that sets a different
                  value is refused when created or synced.
                properties:
                  version: *id001
                  storage: *id002
                  highAvailability: *id003
                  deletionProtection: *id004
                  parameters: *id005
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the backend this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              parametersRefs:
                type: array
                description: |-
                  The deployment's base settings: KafkaParameters objects beneath every object of
                  this class. They are never copied into the object: the platform merges the
                  object's parametersRefs and parameters over them, key by key, at every
                  reconcile. The list merges in order, key by key, a later entry winning; a
                  referenced object names no other.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 253
                    namespace:
                      type: string
                      maxLength: 63
                  required:
                  - name
                  - namespace
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                - namespace
              topicTemplate:
                type: object
                description: |-
                  Defaults written into a KafkaTopic on a cluster of this class when the topic is
                  created; the topic may change them.
                properties:
                  partitions:
                    type: integer
                    minimum: 1
                  replicationFactor:
                    type: integer
                    minimum: 1
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
        required:
        - spec
