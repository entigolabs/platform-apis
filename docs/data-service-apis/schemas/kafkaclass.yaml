---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkaclasses.queue.entigo.com
spec:
  group: queue.entigo.com
  scope: Cluster
  names:
    kind: KafkaClass
    plural: kafkaclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  version: &id001
                    type: string
                    description: |-
                      The Kafka version, such as "4.0". Each implementation accepts the versions it
                      offers (principle 10).
                      Default: the class's template.
                  brokers: &id002
                    type: integer
                    description: |-
                      The number of brokers.
                      Default: the class's template.
                    minimum: 1
                  storage: &id003
                    type: object
                    properties:
                      sizeGB:
                        type: integer
                        description: |-
                          Disk per broker, in GB.
                          Default: the class's template.
                        minimum: 1
                  highAvailability: &id004
                    type: boolean
                    description: |-
                      Survive the loss of one zone. Refused where the class does not support
                      HighAvailability (principle 1).
                      Default: the class's template.
                  deletionProtection: &id005
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  parametersRef:
                    type: object
                    description: |-
                      Engine settings for every object of this class.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                  parameters: &id006
                    type: object
                    description: |-
                      Broker settings for this object only, merged after parametersRef.
                    additionalProperties:
                      type: string
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Always applied; an object that sets a different value is refused.
                properties:
                  version: *id001
                  brokers: *id002
                  storage: *id003
                  highAvailability: *id004
                  deletionProtection: *id005
                  parametersRef:
                    type: object
                    description: |-
                      Engine settings for every object of this class.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                  parameters: *id006
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              standby:
                type: object
                description: |-
                  Settings for a disaster recovery replica in this workspace.
                properties:
                  providerConfig:
                    type: object
                    description: |-
                      Applied only while this workspace is not the primary of disasterRecovery, such
                      as a smaller size for a pilot-light replica.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
          status:
            type: object
            properties:
              supportedFeatures:
                type: array
                description: |-
                  The portable features the implementation supports, written by the implementation
                  (principle 1).
                items:
                  type: string
                  enum:
                  - HighAvailability
                  - ReadReplicas
                  - DisasterRecovery
        required:
        - spec
    subresources:
      status: {}
