---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: valkeyclasses.database.entigo.com
spec:
  group: database.entigo.com
  scope: Cluster
  names:
    kind: ValkeyClass
    plural: valkeyclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  version: &id001
                    type: string
                    description: |-
                      Valkey's major and minor, such as "8.1", and the floor after: raising it
                      upgrades the server, lowering it is rejected. With autoMinorVersionUpgrade, the
                      implementation can move the server past it; the status shows the running
                      version.
                      Default: the class's template.
                    pattern: ^[0-9]+\.[0-9]+$
                  highAvailability: &id002
                    type: boolean
                    description: |-
                      A read replica in another zone, with automatic failover. Needs readReplicas of
                      at least 1. Refused where the implementation does not support HighAvailability
                      (principle 1).
                      Default: the class's template.
                  readReplicas: &id003
                    type: integer
                    description: |-
                      Read replicas besides the primary, each a copy of it. Refused where the
                      implementation does not support ReadReplicas (principle 1).
                      Default: the class's template.
                    minimum: 0
                  deletionProtection: &id004
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  maintenanceWindow: &id005
                    type: object
                    description: |-
                      The weekly hour, in UTC, in which the cloud applies updates.
                    properties:
                      day:
                        type: string
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                      hourUTC:
                        type: integer
                        minimum: 0
                        maximum: 23
                    required:
                    - day
                    - hourUTC
                  autoMinorVersionUpgrade: &id006
                    type: boolean
                    description: |-
                      Allow the implementation to upgrade to newer minor versions on its schedule.
                      false keeps the server at version.
                      Default: the class's template.
                  backup: &id007
                    type: object
                    description: |-
                      Automated daily backups.
                    properties:
                      retentionDays:
                        type: integer
                        description: |-
                          Days automated backups are kept, within the implementation's own range
                          (principle 10). 0 turns automated backups off.
                          Default: the class's template.
                        minimum: 0
                      startHourUTC:
                        type: integer
                        description: |-
                          The hour, in UTC, the daily backup starts.
                        minimum: 0
                        maximum: 23
                  parameters: &id008
                    type: object
                    description: |-
                      Valkey settings for this object only, merged after parametersRef.
                    additionalProperties:
                      type: string
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Applied from creation and at each class sync; an object that sets a different
                  value is refused when created or synced.
                properties:
                  version: *id001
                  highAvailability: *id002
                  readReplicas: *id003
                  deletionProtection: *id004
                  maintenanceWindow: *id005
                  autoMinorVersionUpgrade: *id006
                  backup: *id007
                  parameters: *id008
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              parametersRef:
                type: object
                description: |-
                  A ValkeyParameters beneath every object of this class. It is never copied into
                  the object: the platform merges the object's parametersRef and parameters over
                  it, key by key, at every reconcile.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
        required:
        - spec
