---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: valkeyclasses.database.entigo.com
spec:
  group: database.entigo.com
  scope: Cluster
  names:
    kind: ValkeyClass
    plural: valkeyclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  version: &id001
                    type: string
                    description: |-
                      Valkey's major and minor, such as "8.1", and the floor after: raising it
                      upgrades the server, lowering it is rejected. The backend can move the server to
                      a newer minor; the status shows the running version.
                      Default: the class's template, else the implementation's.
                    pattern: ^[0-9]+\.[0-9]+$
                  highAvailability: &id002
                    type: boolean
                    description: |-
                      A read replica in another zone, with automatic failover. Needs readReplicas of
                      at least 1. Refused where the backend does not support HighAvailability
                      (principle 1).
                      Default: the class's template, else the implementation's.
                  readReplicas: &id003
                    type: integer
                    description: |-
                      Read replicas besides the primary, each a copy of it. Refused where the backend
                      does not support ReadReplicas (principle 1).
                      Default: the class's template, else the implementation's.
                    minimum: 0
                  deletionProtection: &id004
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  parameters: &id005
                    type: object
                    description: |-
                      Valkey settings for this object only, merged after parametersRefs.
                    additionalProperties:
                      type: string
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the backend this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Applied from creation and at each class sync; an object that sets a different
                  value is refused when created or synced.
                properties:
                  version: *id001
                  highAvailability: *id002
                  readReplicas: *id003
                  deletionProtection: *id004
                  parameters: *id005
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the backend this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              parametersRefs:
                type: array
                description: |-
                  The deployment's base settings: ValkeyParameters objects beneath every object of
                  this class. They are never copied into the object: the platform merges the
                  object's parametersRefs and parameters over them, key by key, at every
                  reconcile. The list merges in order, key by key, a later entry winning; a
                  referenced object names no other.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 253
                    namespace:
                      type: string
                      maxLength: 63
                  required:
                  - name
                  - namespace
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                - namespace
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
        required:
        - spec
