---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: rabbitmqbrokers.mq.entigo.com
spec:
  group: mq.entigo.com
  scope: Namespaced
  names:
    kind: RabbitMQBroker
    plural: rabbitmqbrokers
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              className:
                type: string
                description: |-
                  The RabbitMQClass: the deployment's defaults, enforced values and backend
                  (principle 5). Unset, the default class, written at creation; without one, the
                  object is standalone. A standalone object may add it once; it is never changed
                  or removed.
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the id in its provider
                  configuration entry, and never changes or deletes it. Every other common field
                  is then rejected (principle 9). Set at creation only; removing it, once, takes
                  ownership of the resource.
              version:
                type: string
                description: |-
                  RabbitMQ's release line, such as "4.2". The backend manages the patch.
                  Default: the class's template.
                pattern: ^[0-9]+\.[0-9]+$
              highAvailability:
                type: boolean
                description: |-
                  A three-node cluster across zones. Refused where the backend does not support
                  HighAvailability (principle 1).
                  Default: the class's template.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
              parametersRefs:
                type: array
                description: |-
                  Reusable rabbitmq.conf settings: RabbitMQParameters objects in this namespace,
                  merged after the class's. The list merges in order, key by key, a later entry
                  winning; a referenced object names no other.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 253
                  required:
                  - name
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
              parameters:
                type: object
                description: |-
                  rabbitmq.conf settings for this object only, merged after parametersRefs.
                additionalProperties:
                  type: string
              secretName:
                type: string
                description: |-
                  The name of the connection Secret (principle 6). The platform never overwrites a
                  Secret that another object or person owns; set this to avoid one.
                  Default: fixed, <broker>-credentials.
              providerConfigs:
                type: array
                description: |-
                  Settings of single backends, one entry per kind (principle 2). The deployment
                  applies the entry whose group and kind its class names, whatever its version,
                  and ignores the others.
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      description: |-
                        The provider configuration kind's group and version, such as
                        aws.database.entigo.com/v1alpha1.
                      maxLength: 253
                    kind:
                      type: string
                      description: |-
                        The provider configuration kind, such as PostgreSQLRDSConfig.
                      maxLength: 63
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        The settings, checked by the implementation that applies them (principle 10).
                    ref:
                      type: object
                      description: |-
                        The settings in a separate object of this kind, instead of spec.
                      properties:
                        name:
                          type: string
                          description: |-
                            An object of this kind in the same namespace.
                      required:
                      - name
                  required:
                  - apiVersion
                  - kind
                  x-kubernetes-validations:
                  - rule: has(self.spec) != has(self.ref)
                    message: an entry holds either spec or ref
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                x-kubernetes-validations:
                - rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.apiVersion.split('/')[0]
                    == a.apiVersion.split('/')[0]))
                  message: one entry per group and kind, whatever its version
            x-kubernetes-validations:
            - rule: |-
                !has(oldSelf.className)
                || (has(self.className) && self.className == oldSelf.className)
              message: className can be added once, never changed or removed
            - rule: |-
                !(has(self.observe) && self.observe)
                || (has(oldSelf.observe) && oldSelf.observe)
              message: observe can be removed but never set after creation
            - rule: |-
                !(has(self.observe) && self.observe)
                || (!has(self.version) && !has(self.highAvailability) && !has(self.deletionProtection) && !has(self.maintenanceWindow) && !has(self.parametersRefs) && !has(self.parameters))
              message: an observed resource takes no other common field
          status:
            type: object
            properties:
              version:
                type: string
              highAvailability:
                type: boolean
              maintenanceWindow:
                type: object
                properties:
                  day:
                    type: string
                  hourUTC:
                    type: integer
              endpoint:
                type: object
                description: |-
                  The AMQPS address.
                properties:
                  host:
                    type: string
                  port:
                    type: integer
              managementEndpoint:
                type: string
                description: |-
                  The management console URL.
              connectionSecret:
                type: string
                description: |-
                  The Secret <broker>-credentials (principle 6).
              providerConfig:
                type: object
                description: |-
                  The provider configuration entries applied and ignored, as <apiVersion>, <kind>
                  (principle 4).
                properties:
                  applied:
                    type: string
                  ignored:
                    type: array
                    items:
                      type: string
              effective:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Each effective value and its source: the class's template, the object, or the
                  class's enforced (principle 4).
              provider:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values of the applied backend, in the shape its provider configuration kind's
                  status defines (principle 4).
        required:
        - spec
