---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqclasses.mq.entigo.com
spec:
  group: mq.entigo.com
  scope: Cluster
  names:
    kind: RabbitMQClass
    plural: rabbitmqclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  version: &id001
                    type: string
                    description: |-
                      RabbitMQ's release line, such as "4.2". The implementation manages the patch.
                      Default: the class's template.
                    pattern: ^[0-9]+\.[0-9]+$
                  highAvailability: &id002
                    type: boolean
                    description: |-
                      A three-node cluster across zones. Refused where the implementation does not
                      support HighAvailability (principle 1).
                      Default: the class's template.
                  deletionProtection: &id003
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  maintenanceWindow: &id004
                    type: object
                    description: |-
                      The weekly hour, in UTC, in which the cloud applies updates.
                    properties:
                      day:
                        type: string
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                      hourUTC:
                        type: integer
                        minimum: 0
                        maximum: 23
                    required:
                    - day
                    - hourUTC
                  parametersRef: &id005
                    type: object
                    description: |-
                      Reusable rabbitmq.conf settings, merged after the class's.
                    properties:
                      name:
                        type: string
                        description: |-
                          A RabbitMQParameters in this namespace.
                    required:
                    - name
                  parameters: &id006
                    type: object
                    description: |-
                      rabbitmq.conf settings for this object only, merged after parametersRef.
                    additionalProperties:
                      type: string
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Applied from creation and at each class sync; an object that sets a different
                  value is refused.
                properties:
                  version: *id001
                  highAvailability: *id002
                  deletionProtection: *id003
                  maintenanceWindow: *id004
                  parametersRef: *id005
                  parameters: *id006
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              parametersRef:
                type: object
                description: |-
                  A RabbitMQParameters beneath every object of this class. It is never copied into
                  the object: the platform merges the object's parametersRef and parameters over
                  it, key by key, at every reconcile.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
        required:
        - spec
