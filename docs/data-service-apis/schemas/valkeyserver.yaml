---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: valkeyservers.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: ValkeyServer
    plural: valkeyservers
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              className:
                type: string
                description: |-
                  The ValkeyClass: the deployment's defaults, enforced values and implementation
                  (principle 5). Unset, the default class. Set at creation only.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: className is immutable
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the id in its provider
                  configuration entry, and never changes or deletes it. Every other common field
                  is then rejected (principle 9). Set at creation only; removing it, once, takes
                  ownership of the resource.
              version:
                type: string
                description: |-
                  Valkey's major and minor, such as "8.1", and the floor after: raising it
                  upgrades the server, lowering it is rejected. With autoMinorVersionUpgrade, the
                  implementation can move the server past it; the status shows the running
                  version.
                  Default: the class's template.
                pattern: ^[0-9]+\.[0-9]+$
              highAvailability:
                type: boolean
                description: |-
                  A read replica in another zone, with automatic failover. Needs readReplicas of
                  at least 1. Refused where the class does not support HighAvailability (principle
                  1).
                  Default: the class's template.
              readReplicas:
                type: integer
                description: |-
                  Read replicas besides the primary, each a copy of it. Refused where the class
                  does not support ReadReplicas (principle 1).
                  Default: the class's template.
                minimum: 0
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
              autoMinorVersionUpgrade:
                type: boolean
                description: |-
                  Allow the implementation to upgrade to newer minor versions on its schedule.
                  false keeps the server at version.
                  Default: the class's template.
              backup:
                type: object
                description: |-
                  Automated daily backups.
                properties:
                  retentionDays:
                    type: integer
                    description: |-
                      Days automated backups are kept, within the implementation's own range
                      (principle 10). 0 turns automated backups off.
                      Default: the class's template.
                    minimum: 0
                  startHourUTC:
                    type: integer
                    description: |-
                      The hour, in UTC, the daily backup starts.
                    minimum: 0
                    maximum: 23
              parametersRef:
                type: object
                description: |-
                  Reusable Valkey settings, merged after the class's.
                properties:
                  name:
                    type: string
                    description: |-
                      A ValkeyParameters in this namespace.
                required:
                - name
              parameters:
                type: object
                description: |-
                  Valkey settings for this object only, merged after parametersRef.
                additionalProperties:
                  type: string
              secretName:
                type: string
                description: |-
                  The name of the connection Secret (principle 6). The platform never overwrites a
                  Secret that another object or person owns; set this to avoid one.
                  Default: fixed, <instance>-credentials.
              providerConfigs:
                type: array
                description: |-
                  Settings of single implementations, one entry per kind (principle 2). The
                  deployment applies the entry whose group and kind its class names, whatever its
                  version, and ignores the others.
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      description: |-
                        The provider configuration kind's group and version, such as
                        aws.database.entigo.com/v1alpha1.
                      maxLength: 253
                    kind:
                      type: string
                      description: |-
                        The provider configuration kind, such as PostgreSQLRDSConfig.
                      maxLength: 63
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        The settings, checked by the implementation that applies them (principle 10).
                    ref:
                      type: object
                      description: |-
                        The settings in a separate object of this kind, instead of spec.
                      properties:
                        name:
                          type: string
                          description: |-
                            An object of this kind in the same namespace.
                      required:
                      - name
                  required:
                  - apiVersion
                  - kind
                  x-kubernetes-validations:
                  - rule: has(self.spec) != has(self.ref)
                    message: an entry holds either spec or ref
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                x-kubernetes-validations:
                - rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.apiVersion.split('/')[0]
                    == a.apiVersion.split('/')[0]))
                  message: one entry per group and kind, whatever its version
            x-kubernetes-validations:
            - rule: |-
                !(has(self.observe) && self.observe)
                || (has(oldSelf.observe) && oldSelf.observe)
              message: observe can be removed but never set after creation
            - rule: |-
                !(has(self.observe) && self.observe)
                || (!has(self.version) && !has(self.highAvailability) && !has(self.readReplicas) && !has(self.deletionProtection) && !has(self.maintenanceWindow) && !has(self.autoMinorVersionUpgrade) && !has(self.backup) && !has(self.parametersRef) && !has(self.parameters))
              message: an observed resource takes no other common field
            - rule: |-
                !has(self.highAvailability)
                || !self.highAvailability
                || (has(self.readReplicas) && self.readReplicas >= 1)
              message: highAvailability needs readReplicas of at least 1; a value the object does not
                set comes from its class's template
          status:
            type: object
            properties:
              version:
                type: string
              highAvailability:
                type: boolean
              readReplicas:
                type: integer
              maintenanceWindow:
                type: object
                properties:
                  day:
                    type: string
                  hourUTC:
                    type: integer
              autoMinorVersionUpgrade:
                type: boolean
              backup:
                type: object
                properties:
                  retentionDays:
                    type: integer
                  startHourUTC:
                    type: integer
              endpoint:
                type: object
                description: |-
                  The primary's address.
                properties:
                  host:
                    type: string
                  port:
                    type: integer
              readerEndpoint:
                type: object
                description: |-
                  The address that spreads reads over the replicas.
                properties:
                  host:
                    type: string
                  port:
                    type: integer
              connectionSecret:
                type: string
                description: |-
                  The Secret <instance>-credentials (principle 6).
              providerConfig:
                type: object
                description: |-
                  The provider configuration entries applied and ignored, as <apiVersion>, <kind>
                  (principle 4).
                properties:
                  applied:
                    type: string
                  ignored:
                    type: array
                    items:
                      type: string
              effective:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Each effective value and its source: the class's template, the object, or the
                  class's enforced (principle 4).
              provider:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values of the applied implementation, in the shape its provider configuration
                  kind's status defines (principle 4).
        required:
        - spec
