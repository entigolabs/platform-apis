---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqlflexibleserverconfigs.azure.database.entigo.com
spec:
  group: azure.database.entigo.com
  scope: Namespaced
  names:
    kind: PostgreSQLFlexibleServerConfig
    plural: postgresqlflexibleserverconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Azure Database for PostgreSQL flexible server (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Azure Database for PostgreSQL flexible server ID of an existing resource to
                  observe (principle 9). Set with observe; it stays when observe is removed, and
                  the object then owns the resource.
              instanceType:
                type: string
                description: |-
                  The flexible server SKU, such as GP_Standard_D2ds_v5.
                  Default: the class's template, else the implementation's.
              storageTier:
                type: string
                description: |-
                  The disk tier, such as P10, which sets its IOPS.
                  Default: the class's template, else the implementation's.
              autoGrow:
                type: boolean
                description: |-
                  Grow the disk as it fills.
                  Default: fixed, true.
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Azure Database for PostgreSQL flexible server
              (principle 4).
            properties:
              id:
                type: string
              instanceType:
                type: string
              state:
                type: string
        required:
        - spec
    subresources:
      status: {}
