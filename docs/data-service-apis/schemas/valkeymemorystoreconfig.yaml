---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: valkeymemorystoreconfigs.gcp.database.entigo.com
spec:
  group: gcp.database.entigo.com
  scope: Namespaced
  names:
    kind: ValkeyMemorystoreConfig
    plural: valkeymemorystoreconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Memorystore for Valkey (principle 2).
            properties:
              id:
                type: string
