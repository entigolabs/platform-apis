---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: valkeymemorystoreconfigs.gcp.database.entigo.com
spec:
  group: gcp.database.entigo.com
  scope: Namespaced
  names:
    kind: ValkeyMemorystoreConfig
    plural: valkeymemorystoreconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Memorystore for Valkey (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Memorystore for Valkey ID of an existing resource to observe (principle 9).
                  Set with observe; it stays when observe is removed, and the object then owns the
                  resource.
              instanceType:
                type: string
                description: |-
                  The Memorystore node type, such as HIGHMEM_MEDIUM.
                  Default: the class's template, else the implementation's.
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
              backupRetentionDays:
                type: integer
                description: |-
                  Days automated backups are kept, within the backend's own range (principle 10).
                  0 turns automated backups off.
                  Default: fixed, 7.
                minimum: 0
              backupStartHourUTC:
                type: integer
                description: |-
                  The hour, in UTC, the daily backup starts. Unset, the backend picks it.
                minimum: 0
                maximum: 23
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Memorystore for Valkey (principle 4).
            properties:
              id:
                type: string
              instanceType:
                type: string
        required:
        - spec
    subresources:
      status: {}
