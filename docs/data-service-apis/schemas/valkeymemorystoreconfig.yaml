                  The Memorystore for Valkey ID of an existing resource to observe (principle 9).
                  Only with observe.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: id is immutable
              instanceType:
                type: string
                description: |-
                  The Memorystore node type, such as HIGHMEM_MEDIUM.
                  Default: the class's template.
          status:
            type: object
            description: |-
              The shape of status.provider for Memorystore for Valkey (principle 4).
            properties:
              id:
                type: string
              instanceType:
                type: string
        required:
