---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketclasses.storage.entigo.com
spec:
  group: storage.entigo.com
  scope: Cluster
  names:
    kind: BucketClass
    plural: bucketclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  versioning: &id001
                    type: boolean
                    description: |-
                      Keep replaced and deleted objects as versions.
                      Default: the class's template.
                  deletionProtection: &id002
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  lifecycleRules: &id003
                    type: array
                    items:
                      type: object
                      properties:
                        prefix:
                          type: string
                          description: |-
                            Objects whose key starts with this. Unset, every object.
                        expireAfterDays:
                          type: integer
                          description: |-
                            Delete objects this old.
                          minimum: 1
                        deleteNoncurrentAfterDays:
                          type: integer
                          description: |-
                            Delete replaced versions this old.
                          minimum: 1
                        transitions:
                          type: array
                          description: |-
                            Move objects to a colder tier.
                          items:
                            type: object
                            properties:
                              afterDays:
                                type: integer
                                minimum: 1
                              tier:
                                type: string
                                description: |-
                                  One of the two cold tiers every implementation has.
                                enum:
                                - Infrequent
                                - Archive
                            required:
                            - afterDays
                            - tier
                  retention: &id004
                    type: object
                    description: |-
                      Objects cannot be changed or deleted for this many days.
                    properties:
                      days:
                        type: integer
                        minimum: 1
                      locked:
                        type: boolean
                        description: |-
                          true cannot be undone in any implementation.
                    required:
                    - days
                  cors: &id005
                    type: array
                    description: |-
                      Cross-origin requests browsers may make.
                    items:
                      type: object
                      properties:
                        origins:
                          type: array
                          items:
                            type: string
                        methods:
                          type: array
                          items:
                            type: string
                            enum:
                            - GET
                            - PUT
                            - POST
                            - DELETE
                            - HEAD
                        maxAgeSeconds:
                          type: integer
                          minimum: 0
                      required:
                      - origins
                      - methods
                  softDeleteDays: &id006
                    type: integer
                    description: |-
                      Days deleted objects can be recovered.
                      Default: the class's template.
                    minimum: 0
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Always applied; an object that sets a different value is refused.
                properties:
                  versioning: *id001
                  deletionProtection: *id002
                  lifecycleRules: *id003
                  retention: *id004
                  cors: *id005
                  softDeleteDays: *id006
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                        maxLength: 253
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                        maxLength: 63
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
          status:
            type: object
            properties:
              supportedFeatures:
                type: array
                description: |-
                  The portable features the implementation supports, written by the implementation
                  (principle 1).
                items:
                  type: string
                  enum:
                  - HighAvailability
                  - ReadReplicas
        required:
        - spec
    subresources:
      status: {}
