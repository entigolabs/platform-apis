---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketblobstorageconfigs.azure.storage.entigo.com
spec:
  group: azure.storage.entigo.com
  scope: Namespaced
  names:
    kind: BucketBlobStorageConfig
    plural: bucketblobstorageconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Azure Blob Storage (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Azure Blob Storage ID of an existing resource to observe (principle 9). Set
                  with observe; it stays when observe is removed, and the object then owns the
                  resource.
              cors:
                type: array
                description: |-
                  Cross-origin requests browsers may make.
                items:
                  type: object
                  properties:
                    origins:
                      type: array
                      items:
                        type: string
                    methods:
                      type: array
                      items:
                        type: string
                        enum:
                        - GET
                        - PUT
                        - POST
                        - DELETE
                        - HEAD
                    maxAgeSeconds:
                      type: integer
                      minimum: 0
                  required:
                  - origins
                  - methods
              softDeleteDays:
                type: integer
                description: |-
                  Days deleted objects can be recovered. 0 turns soft delete off.
                  Default: fixed, 7.
                minimum: 0
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Azure Blob Storage (principle 4).
            properties:
              accountId:
                type: string
              containerId:
                type: string
        required:
        - spec
    subresources:
      status: {}
