---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: artifactrepositories.artifact.entigo.com
spec:
  group: artifact.entigo.com
  scope: Namespaced
  names:
    kind: ArtifactRepository
    plural: artifactrepositories
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              className:
                type: string
                description: |-
                  The ArtifactRepositoryClass: the deployment's defaults, enforced values and
                  backend (principle 5). Unset, the default class, written at creation; without
                  one, the object is standalone. A standalone object may add it once; it is never
                  changed or removed.
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the id in its provider
                  configuration entry, and never changes or deletes it. Every other common field
                  is then rejected (principle 9). Set at creation only; removing it, once, takes
                  ownership of the resource.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              immutableTags:
                type: boolean
                description: |-
                  A pushed tag cannot be pushed again.
                  Default: the class's template.
              lifecycleRules:
                type: array
                description: |-
                  Delete old images. Set, it replaces the class's rules.
                  Default: the class's template.
                items:
                  type: object
                  description: |-
                    One selector, or none for every image, and one bound.
                  properties:
                    tagPrefixes:
                      type: array
                      description: |-
                        Images with a tag starting with one of these.
                      items:
                        type: string
                    tagPatterns:
                      type: array
                      description: |-
                        Images with a tag matching one of these wildcards.
                      items:
                        type: string
                    untagged:
                      type: boolean
                      description: |-
                        Images without a tag.
                    keepCount:
                      type: integer
                      description: |-
                        Keep this many newest images.
                      minimum: 1
                    expireAfterDays:
                      type: integer
                      description: |-
                        Delete images this long after their push.
                      minimum: 1
                  x-kubernetes-validations:
                  - rule: |-
                      (has(self.tagPrefixes) ? 1 : 0) + (has(self.tagPatterns) ? 1 : 0) + (has(self.untagged) ? 1 : 0) <= 1
                    message: at most one selector
                  - rule: has(self.keepCount) != has(self.expireAfterDays)
                    message: exactly one of keepCount and expireAfterDays
              name:
                type: string
                description: |-
                  The image name. Unset, the object's name. Set at creation only.
              path:
                type: string
                description: |-
                  A prefix between the namespace and the name: the image path is
                  <namespace>/<path>/<name>, or <namespace>/<name> unset. Set at creation only.
              providerConfigs:
                type: array
                description: |-
                  Settings of single backends, one entry per kind (principle 2). The deployment
                  applies the entry whose group and kind its class names, whatever its version,
                  and ignores the others.
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      description: |-
                        The provider configuration kind's group and version, such as
                        aws.database.entigo.com/v1alpha1.
                      maxLength: 253
                    kind:
                      type: string
                      description: |-
                        The provider configuration kind, such as PostgreSQLRDSConfig.
                      maxLength: 63
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        The settings, checked by the implementation that applies them (principle 10).
                    ref:
                      type: object
                      description: |-
                        The settings in a separate object of this kind, instead of spec.
                      properties:
                        name:
                          type: string
                          description: |-
                            An object of this kind in the same namespace.
                      required:
                      - name
                  required:
                  - apiVersion
                  - kind
                  x-kubernetes-validations:
                  - rule: has(self.spec) != has(self.ref)
                    message: an entry holds either spec or ref
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                x-kubernetes-validations:
                - rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.apiVersion.split('/')[0]
                    == a.apiVersion.split('/')[0]))
                  message: one entry per group and kind, whatever its version
            x-kubernetes-validations:
            - rule: |-
                !has(oldSelf.className)
                || (has(self.className) && self.className == oldSelf.className)
              message: className can be added once, never changed or removed
            - rule: |-
                !(has(self.observe) && self.observe)
                || (has(oldSelf.observe) && oldSelf.observe)
              message: observe can be removed but never set after creation
            - rule: |-
                !(has(self.observe) && self.observe)
                || (!has(self.deletionProtection) && !has(self.immutableTags) && !has(self.lifecycleRules))
              message: an observed resource takes no other common field
            - rule: |-
                (has(self.name) ? self.name : '') == (has(oldSelf.name) ? oldSelf.name : '')
              message: name is immutable
            - rule: |-
                (has(self.path) ? self.path : '') == (has(oldSelf.path) ? oldSelf.path : '')
              message: path is immutable
          status:
            type: object
            properties:
              uri:
                type: string
                description: |-
                  The image URI, such as 123456789012.dkr.ecr.eu-
                  north-1.amazonaws.com/shop/orders-api.
              providerConfig:
                type: object
                description: |-
                  The provider configuration entries applied and ignored, as <apiVersion>, <kind>
                  (principle 4).
                properties:
                  applied:
                    type: string
                  ignored:
                    type: array
                    items:
                      type: string
              effective:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Each effective value and its source: the class's template, the object, or the
                  class's enforced (principle 4).
              provider:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values of the applied backend, in the shape its provider configuration kind's
                  status defines (principle 4).
        required:
        - spec
