---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: mariadbusers.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: MariaDBUser
    plural: mariadbusers
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
                description: |-
                  The user's name in the engine, which may hold what a Kubernetes name cannot.
                  Unset, metadata.name. Set at creation only.
              instanceRef:
                type: object
                description: |-
                  The MariaDBInstance this object lives in.
                properties:
                  name:
                    type: string
                    description: |-
                      The MariaDBInstance.
                  namespace:
                    type: string
                    description: |-
                      The MariaDBInstance's namespace, which must be in this object's Zone (rule 11).
                      Unset, this object's namespace.
                required:
                - name
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: instanceRef is immutable
              secretName:
                type: string
                description: |-
                  The name of the connection Secret (rule 6). The platform never overwrites a
                  Secret that another object or person owns; set this to avoid one.
                  Default: fixed, <instance>-<user>.
              databases:
                type: array
                description: |-
                  The databases this user may use on the instance, each with its privileges.
                items:
                  type: object
                  properties:
                    databaseRef:
                      type: object
                      description: |-
                        The database the privileges apply to.
                      properties:
                        name:
                          type: string
                          description: |-
                            The MariaDBDatabase.
                          maxLength: 253
                        namespace:
                          type: string
                          description: |-
                            The MariaDBDatabase's namespace, which must be in this object's Zone (rule 11).
                            Unset, this object's namespace.
                          maxLength: 63
                      required:
                      - name
                    table:
                      type: string
                      description: |-
                        The tables the privileges apply to.
                        Default: fixed, *.
                      maxLength: 64
                    privileges:
                      type: array
                      description: |-
                        Privileges granted, such as SELECT.
                      items:
                        type: string
                        pattern: ^([A-Z0-9_ ]+|[A-Z_ ]+ [(]`[^`]+`(, `[^`]+`)*[)])$
                        maxLength: 256
                      minItems: 1
                      maxItems: 32
                  required:
                  - databaseRef
                  - privileges
                minItems: 1
                maxItems: 16
                x-kubernetes-validations:
                - rule: "self.all(a, self.exists_one(b, b.databaseRef == a.databaseRef && (has(b.table)\
                    \ ? b.table : '*') == (has(a.table) ? a.table : '*')))"
                  message: each database and table appears once
              maxConnectionsPerHour:
                type: integer
                description: |-
                  Connections allowed per hour; 0 is unlimited.
                  Default: fixed, 0.
                minimum: 0
              maxQueriesPerHour:
                type: integer
                description: |-
                  Queries allowed per hour; 0 is unlimited.
                  Default: fixed, 0.
                minimum: 0
              maxUpdatesPerHour:
                type: integer
                description: |-
                  Updates allowed per hour; 0 is unlimited.
                  Default: fixed, 0.
                minimum: 0
              maxUserConnections:
                type: integer
                description: |-
                  Connections allowed at once; 0 means the server's max_connections.
                  Default: fixed, 0.
                minimum: 0
              grant:
                type: object
                properties:
                  users:
                    type: array
                    description: |-
                      Users granted to this user.
                    items:
                      type: string
            x-kubernetes-validations:
            - rule: |-
                (has(self.name) ? self.name : '') == (has(oldSelf.name) ? oldSelf.name : '')
              message: name is immutable
            required:
            - instanceRef
            - databases
          status:
            type: object
            properties:
              connectionSecret:
                type: string
                description: |-
                  The Secret with this user's login (rule 6).
        required:
        - spec
