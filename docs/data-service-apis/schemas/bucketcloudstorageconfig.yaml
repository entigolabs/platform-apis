---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketcloudstorageconfigs.gcp.storage.entigo.com
spec:
  group: gcp.storage.entigo.com
  scope: Namespaced
  names:
    kind: BucketCloudStorageConfig
    plural: bucketcloudstorageconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Cloud Storage (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Cloud Storage ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: id is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Cloud Storage (principle 4).
            properties:
              selfLink:
                type: string
        required:
        - spec
    subresources:
      status: {}
