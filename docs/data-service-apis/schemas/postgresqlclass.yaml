---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqlclasses.database.entigo.com
spec:
  group: database.entigo.com
  scope: Cluster
  names:
    kind: PostgreSQLClass
    plural: postgresqlclasses
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              template:
                type: object
                description: |-
                  Defaults, written into an object when it is created; the object may change them.
                properties:
                  version: &id001
                    type: string
                    description: |-
                      The major version, such as "17". With autoMinorVersionUpgrade false, the full
                      version, such as "17.7".
                      Default: the class's template.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                  storage: &id002
                    type: object
                    properties:
                      sizeGB:
                        type: integer
                        description: |-
                          Disk size in GB at creation, and its floor after: raising it grows the disk,
                          lowering it is rejected. The disk can be larger: it is rounded up to a size the
                          implementation accepts, and autoGrow can take it further. The status shows the
                          real size.
                          Default: the class's template.
                        minimum: 1
                        x-kubernetes-validations:
                        - rule: self >= oldSelf
                          message: storage.sizeGB cannot decrease
                      autoGrow:
                        type: boolean
                        description: |-
                          Grow the disk as it fills.
                          Default: fixed, true.
                      maxSizeGB:
                        type: integer
                        description: |-
                          The size autoGrow stops at.
                          Default: the class's template.
                        minimum: 1
                      iops:
                        type: integer
                        description: |-
                          Provisioned IOPS.
                        minimum: 1
                      throughputMBps:
                        type: integer
                        description: |-
                          Provisioned throughput in MB/s.
                        minimum: 1
                    x-kubernetes-validations:
                    - rule: |-
                        !has(self.maxSizeGB)
                        || !has(self.sizeGB)
                        || self.maxSizeGB >= self.sizeGB
                      message: maxSizeGB must be at least sizeGB
                  highAvailability: &id003
                    type: boolean
                    description: |-
                      A standby in another zone, with automatic failover. Refused where the class does
                      not support HighAvailability (principle 1).
                      Default: the class's template.
                  readReplicas: &id004
                    type: integer
                    description: |-
                      Read-only copies identical to the primary. Refused where the class does not
                      support ReadReplicas (principle 1).
                      Default: fixed, 0.
                    minimum: 0
                  deletionProtection: &id005
                    type: boolean
                    description: |-
                      Deleting the object is denied while true.
                      Default: fixed, true.
                  maintenanceWindow: &id006
                    type: object
                    description: |-
                      The weekly hour, in UTC, in which the cloud applies updates.
                    properties:
                      day:
                        type: string
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                      hourUTC:
                        type: integer
                        minimum: 0
                        maximum: 23
                    required:
                    - day
                    - hourUTC
                  autoMinorVersionUpgrade: &id007
                    type: boolean
                    description: |-
                      Apply new minor versions in the maintenance window. false keeps the minor
                      written in version.
                      Default: the class's template.
                  allowMajorVersionUpgrade: &id008
                    type: boolean
                    description: |-
                      Allow version to change to a later major.
                      Default: fixed, false.
                  backup: &id009
                    type: object
                    properties:
                      retentionDays:
                        type: integer
                        description: |-
                          Days automated backups are kept, within the implementation's own range
                          (principle 10). 0 turns automated backups and point-in-time restore off.
                          Default: the class's template.
                        minimum: 0
                      pointInTimeDays:
                        type: integer
                        description: |-
                          Days back restore.pointInTime can reach.
                          Default: fixed, the lower of retentionDays and the implementation's maximum; none with retentionDays 0.
                        minimum: 1
                      startHourUTC:
                        type: integer
                        description: |-
                          The hour, in UTC, the daily backup starts.
                        minimum: 0
                        maximum: 23
                    x-kubernetes-validations:
                    - rule: |-
                        !has(self.pointInTimeDays)
                        || !has(self.retentionDays)
                        || self.retentionDays > 0
                      message: pointInTimeDays needs backups, which retentionDays 0 disables
                  parametersRef:
                    type: object
                    description: |-
                      Engine settings for every object of this class.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                  parameters: &id010
                    type: object
                    description: |-
                      PostgreSQL settings for this object only, merged after parametersRef.
                    additionalProperties:
                      type: string
                  parameterApplyMethod: &id011
                    type: string
                    description: |-
                      The moment changed parameters take effect. Immediate restarts the instance where
                      a setting needs it.
                      Default: fixed, Immediate.
                    enum:
                    - Immediate
                    - NextRestart
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              enforced:
                type: object
                description: |-
                  Always applied; an object that sets a different value is refused.
                properties:
                  version: *id001
                  storage: *id002
                  highAvailability: *id003
                  readReplicas: *id004
                  deletionProtection: *id005
                  maintenanceWindow: *id006
                  autoMinorVersionUpgrade: *id007
                  allowMajorVersionUpgrade: *id008
                  backup: *id009
                  parametersRef:
                    type: object
                    description: |-
                      Engine settings for every object of this class.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                  parameters: *id010
                  parameterApplyMethod: *id011
                  providerConfig:
                    type: object
                    description: |-
                      The provider configuration: its kind names the implementation this class uses.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
              standby:
                type: object
                description: |-
                  Settings for a disaster recovery replica in this workspace.
                properties:
                  providerConfig:
                    type: object
                    description: |-
                      Applied only while this workspace is not the primary of disasterRecovery, such
                      as a smaller size for a pilot-light replica.
                    properties:
                      apiVersion:
                        type: string
                        description: |-
                          The provider configuration kind's group and version, such as
                          aws.database.entigo.com/v1alpha1.
                      kind:
                        type: string
                        description: |-
                          The provider configuration kind, such as PostgreSQLRDSConfig.
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          The settings.
                    required:
                    - apiVersion
                    - kind
            x-kubernetes-validations:
            - rule: |-
                !has(self.template)
                || !has(self.enforced)
                || !has(self.template.providerConfig)
                || !has(self.enforced.providerConfig)
                || (self.template.providerConfig.apiVersion == self.enforced.providerConfig.apiVersion && self.template.providerConfig.kind == self.enforced.providerConfig.kind)
              message: template and enforced name the same provider configuration kind
          status:
            type: object
            properties:
              supportedFeatures:
                type: array
                description: |-
                  The portable features the implementation supports, written by the implementation
                  (principle 1).
                items:
                  type: string
                  enum:
                  - HighAvailability
                  - ReadReplicas
                  - DisasterRecovery
        required:
        - spec
    subresources:
      status: {}
