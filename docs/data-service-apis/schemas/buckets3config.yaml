---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets3configs.aws.storage.entigo.com
spec:
  group: aws.storage.entigo.com
  scope: Namespaced
  names:
    kind: BucketS3Config
    plural: buckets3configs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Amazon S3 (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Amazon S3 ID of an existing resource to observe (principle 9). Only with
                  observe.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: id is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Amazon S3 (principle 4).
            properties:
              arn:
                type: string
        required:
        - spec
    subresources:
      status: {}
