---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: valkeyelasticacheconfigs.aws.database.entigo.com
spec:
  group: aws.database.entigo.com
  scope: Namespaced
  names:
    kind: ValkeyElastiCacheConfig
    plural: valkeyelasticacheconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for ElastiCache (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The ElastiCache ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
              instanceType:
                type: string
                description: |-
                  The ElastiCache node type, such as cache.t4g.small.
                  Default: the class's template, else the implementation's.
              parameterGroupName:
                type: string
                description: |-
                  An existing ElastiCache parameter group to use, in place of the object's
                  parameters. A major version change needs a new one, since a group fits one major
                  version.
              fromBackup:
                type: string
                description: |-
                  An ElastiCache snapshot name to create the server from, such as
                  status.provider.finalBackup of a deleted server. Set at creation only; not with
                  restore.
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
              autoMinorVersionUpgrade:
                type: boolean
                description: |-
                  Let ElastiCache upgrade to newer minor versions in the maintenance window. false
                  keeps the server at version.
                  Default: fixed, true.
              backupRetentionDays:
                type: integer
                description: |-
                  Days automated backups are kept, within the backend's own range (principle 10).
                  0 turns automated backups off.
                  Default: fixed, 7.
                minimum: 0
              backupStartHourUTC:
                type: integer
                description: |-
                  The hour, in UTC, the daily backup starts. Unset, the backend picks it.
                minimum: 0
                maximum: 23
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
            - rule: |-
                has(self.fromBackup) == has(oldSelf.fromBackup) && (!has(self.fromBackup) || self.fromBackup == oldSelf.fromBackup)
              message: fromBackup is set at creation only
          status:
            type: object
            description: |-
              The shape of status.provider for ElastiCache (principle 4).
            properties:
              instanceType:
                type: string
              finalBackup:
                type: string
                description: |-
                  The ID the final snapshot receives when the server is deleted, for fromBackup.
              engineVersionActual:
                type: string
        required:
        - spec
    subresources:
      status: {}
