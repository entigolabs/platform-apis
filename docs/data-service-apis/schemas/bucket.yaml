---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: buckets.storage.entigo.com
spec:
  group: storage.entigo.com
  scope: Namespaced
  names:
    kind: Bucket
    plural: buckets
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              className:
                type: string
                description: |-
                  The BucketClass: the deployment's defaults, enforced values and implementation
                  (principle 5). Unset, the default class. Set at creation only.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: className is immutable
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the id in its provider
                  configuration entry, and never changes or deletes it. Every other common field
                  is then rejected (principle 9). Set at creation only; removing it, once, takes
                  ownership of the resource.
              versioning:
                type: boolean
                description: |-
                  Keep replaced and deleted objects as versions.
                  Default: the class's template.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              lifecycleRules:
                type: array
                items:
                  type: object
                  properties:
                    prefix:
                      type: string
                      description: |-
                        Objects whose key starts with this. Unset, every object.
                    expireAfterDays:
                      type: integer
                      description: |-
                        Delete objects this old.
                      minimum: 1
                    deleteNoncurrentAfterDays:
                      type: integer
                      description: |-
                        Delete replaced versions this old.
                      minimum: 1
                    transitions:
                      type: array
                      description: |-
                        Move objects to a colder tier.
                      items:
                        type: object
                        properties:
                          afterDays:
                            type: integer
                            minimum: 1
                          tier:
                            type: string
                            description: |-
                              One of the two cold tiers every implementation has.
                            enum:
                            - Infrequent
                            - Archive
                        required:
                        - afterDays
                        - tier
              retention:
                type: object
                description: |-
                  Objects cannot be changed or deleted for this many days.
                properties:
                  days:
                    type: integer
                    minimum: 1
                  locked:
                    type: boolean
                    description: |-
                      true cannot be undone in any implementation.
                    x-kubernetes-validations:
                    - rule: "!oldSelf || self"
                      message: a locked retention cannot be unlocked
                required:
                - days
              cors:
                type: array
                description: |-
                  Cross-origin requests browsers may make.
                items:
                  type: object
                  properties:
                    origins:
                      type: array
                      items:
                        type: string
                    methods:
                      type: array
                      items:
                        type: string
                        enum:
                        - GET
                        - PUT
                        - POST
                        - DELETE
                        - HEAD
                    maxAgeSeconds:
                      type: integer
                      minimum: 0
                  required:
                  - origins
                  - methods
              softDeleteDays:
                type: integer
                description: |-
                  Days deleted objects can be recovered.
                  Default: the class's template.
                minimum: 0
              providerConfigs:
                type: array
                description: |-
                  Settings of single implementations, one entry per kind (principle 2). The
                  deployment applies the entry whose kind its class names and ignores the others.
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      description: |-
                        The provider configuration kind's group and version, such as
                        aws.database.entigo.com/v1alpha1.
                    kind:
                      type: string
                      description: |-
                        The provider configuration kind, such as PostgreSQLRDSConfig.
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        The settings, checked by the implementation that applies them (principle 10).
                    ref:
                      type: object
                      description: |-
                        The settings in a separate object of this kind, instead of spec.
                      properties:
                        name:
                          type: string
                          description: |-
                            An object of this kind in the same namespace.
                      required:
                      - name
                  required:
                  - apiVersion
                  - kind
                  x-kubernetes-validations:
                  - rule: has(self.spec) != has(self.ref)
                    message: an entry holds either spec or ref
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
            x-kubernetes-validations:
            - rule: |-
                !(has(self.observe) && self.observe)
                || (has(oldSelf.observe) && oldSelf.observe)
              message: observe can be removed but never set after creation
            - rule: |-
                !(has(self.observe) && self.observe)
                || (!has(self.versioning) && !has(self.deletionProtection) && !has(self.lifecycleRules) && !has(self.retention) && !has(self.cors) && !has(self.softDeleteDays))
              message: an observed resource takes no other common field
            - rule: |-
                !has(oldSelf.retention)
                || !has(oldSelf.retention.locked)
                || !oldSelf.retention.locked
                || (has(self.retention) && has(self.retention.locked) && self.retention.locked)
              message: a locked retention cannot be unlocked or removed
          status:
            type: object
            properties:
              url:
                type: string
              bucketName:
                type: string
              region:
                type: string
              providerConfig:
                type: object
                description: |-
                  The provider configuration entries applied and ignored, as <apiVersion>, <kind>
                  (principle 4).
                properties:
                  applied:
                    type: string
                  ignored:
                    type: array
                    items:
                      type: string
              effective:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Each effective value and its source: the class's template, the object, or the
                  class's enforced (principle 4).
              provider:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values of the applied implementation, in the shape its provider configuration
                  kind's status defines (principle 4).
        required:
        - spec
