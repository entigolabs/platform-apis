---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: buckets.storage.entigo.com
spec:
  group: storage.entigo.com
  scope: Namespaced
  names:
    kind: Bucket
    plural: buckets
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              className:
                type: string
                description: |-
                  The BucketClass: the deployment's defaults, enforced values and backend
                  (principle 5). Unset, the default class, written at creation; without one, the
                  object is standalone. A standalone object may add it once; it is never changed
                  or removed.
              observe:
                type: boolean
                description: |-
                  true observes an existing resource, named by the id in its provider
                  configuration entry, and never changes or deletes it. Every other common field
                  is then rejected (principle 9). Set at creation only; removing it, once, takes
                  ownership of the resource.
              versioning:
                type: boolean
                description: |-
                  Keep replaced and deleted objects as versions.
                  Default: the class's template.
              deletionProtection:
                type: boolean
                description: |-
                  Deleting the object is denied while true.
                  Default: fixed, true.
              lifecycleRules:
                type: array
                items:
                  type: object
                  properties:
                    prefix:
                      type: string
                      description: |-
                        Objects whose key starts with this. Unset, every object.
                    expireAfterDays:
                      type: integer
                      description: |-
                        Delete objects this old.
                      minimum: 1
                    deleteNoncurrentAfterDays:
                      type: integer
                      description: |-
                        Delete replaced versions this old.
                      minimum: 1
                    transitions:
                      type: array
                      description: |-
                        Move objects to a colder tier.
                      items:
                        type: object
                        properties:
                          afterDays:
                            type: integer
                            minimum: 1
                          tier:
                            type: string
                            description: |-
                              One of the two cold tiers every backend has.
                            enum:
                            - Infrequent
                            - Archive
                        required:
                        - afterDays
                        - tier
              retention:
                type: object
                description: |-
                  Objects cannot be changed or deleted for this many days.
                properties:
                  days:
                    type: integer
                    minimum: 1
                  locked:
                    type: boolean
                    description: |-
                      true cannot be undone in any backend.
                    x-kubernetes-validations:
                    - rule: "!oldSelf || self"
                      message: a locked retention cannot be unlocked
                required:
                - days
              providerConfigs:
                type: array
                description: |-
                  Settings of single backends, one entry per kind (principle 2). The deployment
                  applies the entry whose group and kind its class names, whatever its version,
                  and ignores the others.
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      description: |-
                        The provider configuration kind's group and version, such as
                        aws.database.entigo.com/v1alpha1.
                      maxLength: 253
                    kind:
                      type: string
                      description: |-
                        The provider configuration kind, such as PostgreSQLRDSConfig.
                      maxLength: 63
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        The settings, checked by the implementation that applies them (principle 10).
                    ref:
                      type: object
                      description: |-
                        The settings in a separate object of this kind, instead of spec.
                      properties:
                        name:
                          type: string
                          description: |-
                            An object of this kind in the same namespace.
                      required:
                      - name
                  required:
                  - apiVersion
                  - kind
                  x-kubernetes-validations:
                  - rule: has(self.spec) != has(self.ref)
                    message: an entry holds either spec or ref
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                x-kubernetes-validations:
                - rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.apiVersion.split('/')[0]
                    == a.apiVersion.split('/')[0]))
                  message: one entry per group and kind, whatever its version
            x-kubernetes-validations:
            - rule: |-
                !has(oldSelf.className)
                || (has(self.className) && self.className == oldSelf.className)
              message: className can be added once, never changed or removed
            - rule: |-
                !(has(self.observe) && self.observe)
                || (has(oldSelf.observe) && oldSelf.observe)
              message: observe can be removed but never set after creation
            - rule: |-
                !(has(self.observe) && self.observe)
                || (!has(self.versioning) && !has(self.deletionProtection) && !has(self.lifecycleRules) && !has(self.retention))
              message: an observed resource takes no other common field
            - rule: |-
                !has(oldSelf.retention)
                || !has(oldSelf.retention.locked)
                || !oldSelf.retention.locked
                || (has(self.retention) && has(self.retention.locked) && self.retention.locked)
              message: a locked retention cannot be unlocked or removed
          status:
            type: object
            properties:
              url:
                type: string
              bucketName:
                type: string
              region:
                type: string
              providerConfig:
                type: object
                description: |-
                  The provider configuration entries applied and ignored, as <apiVersion>, <kind>
                  (principle 4).
                properties:
                  applied:
                    type: string
                  ignored:
                    type: array
                    items:
                      type: string
              effective:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Each effective value and its source: the class's template, the object, or the
                  class's enforced (principle 4).
              provider:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values of the applied backend, in the shape its provider configuration kind's
                  status defines (principle 4).
        required:
        - spec
