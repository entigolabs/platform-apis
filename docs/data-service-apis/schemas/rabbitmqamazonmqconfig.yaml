---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqamazonmqconfigs.aws.mq.entigo.com
spec:
  group: aws.mq.entigo.com
  scope: Namespaced
  names:
    kind: RabbitMQAmazonMQConfig
    plural: rabbitmqamazonmqconfigs
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: |-
              Settings for Amazon MQ (principle 2).
            properties:
              id:
                type: string
                description: |-
                  The Amazon MQ ID of an existing resource to observe (principle 9). Set with
                  observe; it stays when observe is removed, and the object then owns the
                  resource.
              instanceType:
                type: string
                description: |-
                  The Amazon MQ host instance type, such as mq.m7g.medium.
                  Default: the class's template, else the implementation's.
              publiclyAccessible:
                type: boolean
                description: |-
                  Reachable from the internet, without the platform's security group. Amazon MQ
                  replaces the broker to change it, so it is set at creation only.
                  Default: fixed, false.
              maintenanceWindow:
                type: object
                description: |-
                  The weekly hour, in UTC, in which the cloud applies updates.
                properties:
                  day:
                    type: string
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
                  hourUTC:
                    type: integer
                    minimum: 0
                    maximum: 23
                required:
                - day
                - hourUTC
            x-kubernetes-validations:
            - rule: |-
                has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id == oldSelf.id)
              message: id is immutable
            - rule: |-
                has(self.publiclyAccessible) == has(oldSelf.publiclyAccessible) && (!has(self.publiclyAccessible) || self.publiclyAccessible == oldSelf.publiclyAccessible)
              message: publiclyAccessible is immutable
          status:
            type: object
            description: |-
              The shape of status.provider for Amazon MQ (principle 4).
            properties:
              instanceType:
                type: string
              id:
                type: string
              engineVersion:
                type: string
        required:
        - spec
    subresources:
      status: {}
