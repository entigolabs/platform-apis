---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqlparameters.database.entigo.com
spec:
  group: database.entigo.com
  scope: Namespaced
  names:
    kind: PostgreSQLParameters
    plural: postgresqlparameters
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                description: |-
                  PostgreSQL settings, by name. Keys outside the backend's allowlist are rejected
                  by the cloud (principle 10).
                additionalProperties:
                  type: string
            required:
            - parameters
        required:
        - spec
