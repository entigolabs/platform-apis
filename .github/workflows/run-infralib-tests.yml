name: Execute Infralib Tests

# Runs the end-to-end suites on the infralib branch prepare-infralib-branch
# made: the framework's test.sh (entigo-infralib-test) applies the module in
# its regular step on aws_biz and runs the tests copied into the module. The
# contributor and maintainer IAM users of the role tests travel into the
# test container through INFRALIB_TEST_EXTRA_ENV.

on:
  workflow_call:
    inputs:
      branch_name:
        description: "Infralib branch to test"
        required: true
        type: string
      helm_version:
        description: "Helm version (for reporting only)"
        required: true
        type: string

env:
  INFRALIB_REPO: entigolabs/entigo-infralib
  INFRALIB_MODULE_PATH: modules/k8s/platform-apis
  ENVIRONMENT: aws_biz

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    concurrency:
      group: infralib-e2e-tests
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      # The infralib branch is the working directory: test.sh and the
      # framework's actions read the environments from the repository root.
      - name: Checkout entigo-infralib
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRALIB_REPO }}
          token: ${{ secrets.INFRALIB_PAT }}
          ref: ${{ inputs.branch_name }}

      - name: Kubeconfig for ${{ env.ENVIRONMENT }}
        uses: entigolabs/entigo-infralib-test/.github/actions/kubeconfig@main
        with:
          environments: ${{ env.ENVIRONMENT }}

      - name: Apply and test ${{ env.INFRALIB_MODULE_PATH }} ${{ inputs.helm_version }} on ${{ env.ENVIRONMENT }}
        env:
          CONTRIBUTOR_AWS_ACCESS_KEY_ID: ${{ secrets.CONTRIBUTOR_AWS_ACCESS_KEY_ID }}
          CONTRIBUTOR_AWS_SECRET_ACCESS_KEY: ${{ secrets.CONTRIBUTOR_AWS_SECRET_ACCESS_KEY }}
          MAINTAINER_AWS_ACCESS_KEY_ID: ${{ secrets.MAINTAINER_AWS_ACCESS_KEY_ID }}
          MAINTAINER_AWS_SECRET_ACCESS_KEY: ${{ secrets.MAINTAINER_AWS_SECRET_ACCESS_KEY }}
          INFRALIB_TEST_EXTRA_ENV: CONTRIBUTOR_AWS_ACCESS_KEY_ID CONTRIBUTOR_AWS_SECRET_ACCESS_KEY MAINTAINER_AWS_ACCESS_KEY_ID MAINTAINER_AWS_SECRET_ACCESS_KEY
        run: ./test.sh --env "${ENVIRONMENT}" --timeout 60m "${INFRALIB_MODULE_PATH}"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infralib-logs-${{ inputs.helm_version }}
          path: logs/
          if-no-files-found: ignore
