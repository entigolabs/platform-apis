name: Build Functions

# Every function package is multi-arch (amd64 and arm64). Each architecture
# builds its runtime image on a runner of its own kind, never under QEMU:
# amd64 on the self-hosted runner set, arm64 on GitHub's arm64 runner (free
# for a public repository). The build jobs upload single-platform packages
# as artifacts, and the push job per function downloads the two and pushes
# them as one multi-platform package.

on:
  workflow_call:
    inputs:
      functions:
        description: JSON array of functions to build
        required: true
        type: string
      release_type:
        description: 'stable or rc'
        required: true
        type: string
      pr_number:
        description: PR number (for rc releases)
        required: false
        type: string
        default: ''
      run_number:
        description: Workflow run number
        required: false
        type: string
        default: ''
      run_attempt:
        description: Workflow run attempt
        required: false
        type: string
        default: ''

env:
  GO_VERSION: '1.25'
  DOCKER_BUILDX_VERSION: 'v0.26.1'

jobs:
  build:
    name: Build ${{ matrix.function }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJson(inputs.functions) }}
        arch: [amd64, arm64]
        include:
        - arch: amd64
          runner: arc-runner-set
        - arch: arm64
          runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Remove test files
        run: rm -f *_test.go run_tests.sh

      - name: Build runtime image
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --progress=plain \
            --cache-from type=gha,scope=${{ matrix.function }}-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.function }}-${{ matrix.arch }} \
            --target image \
            --build-arg GO_VERSION=${{ env.GO_VERSION }} \
            --output type=docker,dest=${{ matrix.function }}/runtime-${{ matrix.arch }}.tar \
            -f ${{ matrix.function }}/Dockerfile \
            .
        working-directory: functions/

      - name: Setup Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build package
        run: ./crossplane xpkg build --package-file=${{ matrix.arch }}.xpkg --package-root=package/ --embed-runtime-image-tarball=runtime-${{ matrix.arch }}.tar

      - name: Upload single-platform package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.function }}-${{ matrix.arch }}
          path: functions/${{ matrix.function }}/${{ matrix.arch }}.xpkg
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push ${{ matrix.function }}
    needs: build
    runs-on: arc-runner-set
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJson(inputs.functions) }}
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      # The version calculation reads helm/Chart.yaml of this commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download single-platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-${{ matrix.function }}-*
          path: functions/${{ matrix.function }}
          merge-multiple: true

      - name: Setup Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate version
        id: version
        uses: ./.github/actions/calculate-version
        with:
          pkg_name: "platform-apis-${{ matrix.function }}-fn"
          release_type: ${{ inputs.release_type }}
          pr_number: ${{ inputs.pr_number }}
          run_number: ${{ inputs.run_number }}
          run_attempt: ${{ inputs.run_attempt }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: |
          set -euo pipefail
          # Both halves or nothing: a package with one platform must never be pushed.
          ls -l amd64.xpkg arm64.xpkg
          XPKG="ghcr.io/${{ github.repository_owner }}/platform-apis-${{ matrix.function }}-fn"
          ./crossplane --verbose xpkg push --package-files amd64.xpkg,arm64.xpkg ${XPKG,,}:${{ steps.version.outputs.version }}
