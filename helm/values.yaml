global:
  # ARNs of the environment's KMS keys, supplied by the infralib agent from optional
  # outputs. Empty means the environment has no KMS module, and every KMS reference in
  # the EnvironmentConfigs below drops out. Resources then fall back to AWS-managed keys.
  kms:
    dataKeyArn: ""
    configKeyArn: ""
    dataAliasArn: ""

workspace: ""

database:
  function:
    image: ghcr.io/entigolabs/platform-apis-database-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: crossplane-aws
    dataKMSKey: data
    configKMSKey: config
    vpc: vpc
    subnetGroup: database
    elasticacheSubnetGroup: elasticache
    esClusterSecretStore: external-secrets
    # Take a final snapshot before an instance is deleted, so the data can still be recovered.
    # Set to false only where the data does not matter, a deleted instance is then gone for good.
    postgresBackupBeforeDeletion: true
    mariaDBBackupBeforeDeletion: true
    valkeyBackupBeforeDeletion: true
    # Days of automatic daily backups AWS keeps, and therefore how far back an instance can be
    # restored. Applies to PostgreSQL and MariaDB. An instance can override it with
    # spec.backupRetentionPeriod. Valkey uses spec.snapshotRetentionLimit instead.
    backupRetentionPeriod: 14
    # Cloud tags added to every database resource.
    tags: {}

postgresql:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-postgresql
    tag: v0.0.0

mariadb:
  install: false
  package:
    image: ghcr.io/entigolabs/platform-apis-mariadb
    tag: v0.0.0

valkey:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-valkey
    tag: v0.0.0

artifact:
  function:
    image: ghcr.io/entigolabs/platform-apis-artifact-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: "crossplane-aws"
    dataKMSKey: data
    # Scan every pushed image for known vulnerabilities.
    scanOnPush: true
    # Whether an existing image tag can be overwritten by a new push.
    # MUTABLE: pushing the same tag again replaces the image.
    # IMMUTABLE: a tag can only be pushed once, which guarantees a deployed tag always refers to
    # the same image. Pipelines that re-push the same tag will start failing.
    # IMMUTABLE_WITH_EXCLUSION and MUTABLE_WITH_EXCLUSION apply the same rule with an AWS-side
    # exception list.
    imageTagMutability: "MUTABLE"
    # Cloud tags added to every repository.
    tags: {}
    # Default ECR lifecycle policy for every repository. Repositories can replace the whole list
    # through spec.lifecycleRules. Leave empty to create no lifecycle policy at all.
    # Each rule takes one selector (tagPrefixes, tagPatterns or untagged) and one retention bound
    # (keepCount or expireAfterDays). A rule without a selector matches every image and must be last.
    lifecycleRules: []
    # lifecycleRules:
    #   - untagged: true
    #     expireAfterDays: 7
    #   - keepCount: 20

repository:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-repository
    tag: v0.0.0

storage:
  function:
    image: ghcr.io/entigolabs/platform-apis-storage-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: "crossplane-aws"
    dataKMSKey: data
    configKMSKey: config
    # Cloud tags added to every bucket and its IAM resources.
    tags: {}

s3bucket:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-s3bucket
    tag: v0.0.0

queue:
  function:
    image: ghcr.io/entigolabs/platform-apis-queue-fn
    tag: v0.0.0

kafka:
  install: false
  environmentConfig:
    awsProvider: "crossplane-aws"
    configKMSKey: config
    kafkaNamespace: crossplane-kafka
    # Cloud tags added to the cloud resources created for Kafka users and topics.
    tags: {}
  package:
    image: ghcr.io/entigolabs/platform-apis-kafka
    tag: v0.0.0

mq:
  function:
