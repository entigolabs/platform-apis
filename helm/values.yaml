global:
  # ARNs of the environment's KMS keys, supplied by the infralib agent from optional
  # outputs. Empty means the environment has no KMS module, and every KMS reference in
  # the EnvironmentConfigs below drops out. Resources then fall back to AWS-managed keys.
  kms:
    dataKeyArn: ""
    configKeyArn: ""
    dataAliasArn: ""

workspace: ""

database:
  function:
    image: ghcr.io/entigolabs/platform-apis-database-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: crossplane-aws
    dataKMSKey: data
    configKMSKey: config
    vpc: vpc
    subnetGroup: database
    elasticacheSubnetGroup: elasticache
    esClusterSecretStore: external-secrets
    # Take a final snapshot before an instance is deleted, so the data can still be recovered.
    # Set to false only where the data does not matter, a deleted instance is then gone for good.
    postgresBackupBeforeDeletion: true
    mariaDBBackupBeforeDeletion: true
    valkeyBackupBeforeDeletion: true
    # Days of automatic daily backups AWS keeps, and therefore how far back an instance can be
    # restored. Applies to PostgreSQL and MariaDB. An instance can override it with
    # spec.backupRetentionPeriod. Valkey uses spec.snapshotRetentionLimit instead.
    backupRetentionPeriod: 14
    # Cloud tags added to every database resource.
    tags: {}

postgresql:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-postgresql
    tag: v0.0.0

mariadb:
  install: false
  package:
    image: ghcr.io/entigolabs/platform-apis-mariadb
    tag: v0.0.0

valkey:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-valkey
    tag: v0.0.0

artifact:
  function:
    image: ghcr.io/entigolabs/platform-apis-artifact-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: "crossplane-aws"
    dataKMSKey: data
    vpc: vpc
    # Scan every pushed image for known vulnerabilities.
    scanOnPush: true
    # Whether an existing image tag can be overwritten by a new push.
    # MUTABLE: pushing the same tag again replaces the image.
    # IMMUTABLE: a tag can only be pushed once, which guarantees a deployed tag always refers to
    # the same image. Pipelines that re-push the same tag will start failing.
    # IMMUTABLE_WITH_EXCLUSION and MUTABLE_WITH_EXCLUSION apply the same rule with an AWS-side
    # exception list.
    imageTagMutability: "MUTABLE"
    # Cloud tags added to every repository.
    tags: {}
    # Default ECR lifecycle policy for every repository. Repositories can replace the whole list
    # through spec.lifecycleRules. Leave empty to create no lifecycle policy at all.
    # Each rule takes one selector (tagPrefixes, tagPatterns or untagged) and one retention bound
    # (keepCount or expireAfterDays). A rule without a selector matches every image and must be last.
    lifecycleRules: []
    # lifecycleRules:
    #   - untagged: true
    #     expireAfterDays: 7
    #   - keepCount: 20

repository:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-repository
    tag: v0.0.0

storage:
  function:
    image: ghcr.io/entigolabs/platform-apis-storage-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: "crossplane-aws"
    dataKMSKey: data
    configKMSKey: config
    # Cloud tags added to every bucket and its IAM resources.
    tags: {}

s3bucket:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-s3bucket
    tag: v0.0.0

queue:
  function:
    image: ghcr.io/entigolabs/platform-apis-queue-fn
    tag: v0.0.0

kafka:
  install: false
  environmentConfig:
    awsProvider: "crossplane-aws"
    configKMSKey: config
    kafkaNamespace: crossplane-kafka
    # Cloud tags added to the cloud resources created for Kafka users and topics.
    tags: {}
  package:
    image: ghcr.io/entigolabs/platform-apis-kafka
    tag: v0.0.0

mq:
  function:
    image: ghcr.io/entigolabs/platform-apis-mq-fn
    tag: v0.0.0
  environmentConfig:
    awsProvider: "crossplane-aws"
    # Amazon MQ's encryptionOptions key encrypts the broker's message storage, which is
    # application data - so this is the data key, not the config key.
    dataKMSKey: data
    vpc: vpc
    subnetGroup: database
    # Cloud tags added to every broker.
    tags: {}

rabbitmq:
  install: false
  package:
    image: ghcr.io/entigolabs/platform-apis-rabbitmq
    tag: v0.0.0

tenancy:
  function:
    image: ghcr.io/entigolabs/platform-apis-tenancy-fn
    tag: v0.0.0

zone:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-zone
    tag: v0.0.0
  environmentConfig:
    # Create the "<zone-name>-apps" Namespace that holds a Zone's ArgoCD Application and
    # ApplicationSet objects, for the app-of-apps pattern.
    createAppsNamespace: true
    # Whether outgoing rules are shared by the whole cluster or kept per Zone. This does not
    # decide whether the cluster can reach the internet, that is normally handled by a firewall
    # in front of the cluster either way.
    # false: outgoing rules are cluster-wide, an address opened by one Zone is reachable from
    # every other Zone.
    # true: each Zone has its own outgoing rules, an address opened for Zone A stays closed for
    # Zone B. Adds a proxy container to every pod in the Zone's Namespaces, so applications must
    # be restarted and every external service a Zone uses has to be listed for that Zone.
    # External hosts are opened with Istio ServiceEntry objects. With granularEgress enabled a
    # ServiceEntry only applies to the Zone whose Namespace it was created in.
    granularEgress: false
    # Zone names that keep the shared, unrestricted behaviour while granularEgress is enabled.
    granularEgressExclude: []
    # false: all Namespaces in the same Zone can reach each other.
    # true: every Namespace is isolated and needs a NetworkPolicy to accept traffic, even from
    # another Namespace in the same Zone. A Zone can override this with
    # spec.granularNamespaceNetworkPolicy.
    granularNamespaceNetworkPolicy: false
    argoCDNamespace: "argocd"
    awsProvider: "crossplane-aws"
    # User groups that get a role in every Zone. A Zone can add its own groups with
    # spec.roleMapping, which applies only to that Zone's Namespaces.
    roleMapping:
      - roleRef: maintainer
        groups: ["maintainer"]
      - roleRef: observer
        groups: ["observer"]
      - roleRef: contributor
        groups: ["contributor"]
    # Controls what ArgoCD is allowed to deploy into a Zone's Namespaces through the Zone's
    # AppProject.
    appProject:
      maintainerGroups: []
      observerGroups: []
      sourceRepos: ["*"]
      namespaceResourceBlacklist:
        - group: "*.m.upbound.io"
          kind: "*"
      namespaceResourceWhitelist: []
    cluster: eks
    dataKMSAlias: data
    securityGroup: "eks-node"
    vpc: vpc
    computeSubnetType: compute
    # Lowest Pod Security Admission level a Namespace in a Zone is allowed to run at. Every
    # Namespace is labelled with this and can only be changed to a stricter level.
    # baseline: blocks the well-known dangerous options, a team may opt into restricted.
    # restricted: containers must also run as non-root without extra privileges. Recommended for
    # production, but workloads that need root will stop starting.
    # privileged: no floor at all, not recommended.
    podSecurity: baseline
    # Cloud tags added to Zone resources such as NodeGroups.
    tags: {}
  # Copies the labels and annotations an ArgoCD Application declares under
  # spec.syncPolicy.managedNamespaceMetadata onto the Namespace that Application deploys to.
  # Labels that decide which Zone a Namespace belongs to are ignored, those can only be changed
  # with kubectl. The tenancy.entigo.com/pool label is applied, it picks one of the Zone's own
  # NodeGroups. A Pod Security label is applied, but only when it is stricter than the Zone's
  # podSecurity level.
  namespaceMetadata:
    enabled: true
    # How often every Namespace is refreshed from the Application specs. Metadata of a newly
    # created Application is applied immediately, later edits to an existing Application are
    # picked up by this refresh.
    syncInterval: 10m
  # Labels every Namespace of a Zone with istio-injection=enabled while granularEgress is enabled,
  # so the Sidecar the Zone creates is actually enforced. Zones in granularEgressExclude are
  # labelled too, that setting only relaxes their egress rules to ALLOW_ANY and their workloads
  # still want mTLS. The infralib Zone and the "<zone>-apps" Namespaces are skipped. Only used when
  # granularEgress is on; while it is off the label is left entirely to the user, who may enable
  # injection themselves.
  istioInjection:
    # How often Namespaces that already existed when granularEgress was turned on are re-checked.
    # A newly created Namespace is labelled immediately and does not wait for this refresh.
    syncInterval: 10m
  # ServiceEntries created once in the Istio namespace so every Zone can reach the shared
  # infrastructure subnets while granularEgress is on. Every Zone's Sidecar egress list contains
  # "<istioNamespace>/*", so a single entry per subnet group serves the whole cluster and the Zone
  # composition does not have to generate one per Namespace.
  #
  # Only rendered while zone.environmentConfig.granularEgress is enabled. A group whose cidrs list
  # is empty is skipped entirely, because a ServiceEntry with addresses unset matches every
  # destination on its ports instead of none.
  #
  # Ports must be listed one by one: a ServiceEntry has no port range syntax, and omitting ports
  # opens nothing rather than everything.
  istioServiceEntries:
    # Namespace the entries are created in. Must be the Namespace the Zone Sidecars allow, which is
    # istio-system unless Istio was installed elsewhere.
    istioNamespace: istio-system
    # Managed data services: RDS, ElastiCache and MSK. Deliberately one group rather than separate
    # database and elasticache groups, so a Valkey launched into the database subnet works the same
    # as one in the elasticache subnet.
    #
    # cidrs takes a YAML list or a comma separated string. infralib passes a subnet output through
    # as one comma separated value, and two of them are joined with a comma:
    #   cidrs: "{{ .toutput.vpc.database_subnets_cidr_blocks }},{{ .toutput.vpc.elasticache_subnets_cidr_blocks }}"
    # Empty segments are dropped, so an environment with no elasticache subnets is harmless.
    data:
      cidrs: ""
      ports:
        - {number: 3306, name: tcp-mysql, protocol: TCP}       # MySQL, MariaDB, Aurora MySQL
        - {number: 5432, name: tcp-postgres, protocol: TCP}    # PostgreSQL, Aurora PostgreSQL
        - {number: 1521, name: tcp-oracle, protocol: TCP}
        - {number: 1433, name: tcp-sqlserver, protocol: TCP}
        - {number: 50000, name: tcp-db2, protocol: TCP}
        - {number: 6379, name: tcp-valkey, protocol: TCP}      # Valkey / Redis OSS
        - {number: 6380, name: tcp-valkey-serverless, protocol: TCP}
        - {number: 11211, name: tcp-memcached, protocol: TCP}
        - {number: 11212, name: tcp-memcached-serverless, protocol: TCP}
        - {number: 9092, name: tcp-kafka-plaintext, protocol: TCP}
        - {number: 9094, name: tcp-kafka-tls, protocol: TCP}
        - {number: 9096, name: tcp-kafka-sasl, protocol: TCP}
        - {number: 9098, name: tcp-kafka-iam, protocol: TCP}
        - {number: 2181, name: tcp-zookeeper, protocol: TCP}
        - {number: 2182, name: tcp-zookeeper-tls, protocol: TCP}
    # CIDRs Pod IPs come from, used only as a guard. The service group is skipped when its CIDRs
    # overlap these, see below. Leave empty to disable the guard.
    #   podCidrs: "{{ .toutput.vpc.compute_subnets_cidr_blocks }}"
    podCidrs: ""
    # Internal services reachable inside the VPC.
    #   cidrs: "{{ .toutput.vpc.service_subnets_cidr_blocks }}"
    # With subnet_split_mode "default" the VPC returns the same private subnet CIDRs for the
    # service and the compute subnets, so this group would open its ports to every Pod. Setting
    # podCidrs makes that case skip itself. With "spoke" the two are disjoint and the group is
    # created as written.
    service:
      cidrs: ""
      ports:
        - {number: 80, name: tcp-http, protocol: TCP}
        - {number: 443, name: tcp-https, protocol: TCP}
        - {number: 8080, name: tcp-http-alt, protocol: TCP}
        - {number: 8443, name: tcp-https-alt, protocol: TCP}
    # Additional subnets a cluster needs to reach, each with its own ports. One ServiceEntry is
    # created per entry, named "<name>-subnets".
    # extraSubnets:
    #   - name: partner-database
    #     cidrs: ["10.90.0.0/24"]
    #     ports:
    #       - {number: 5432, name: tcp-postgres, protocol: TCP}
    extraSubnets: []
    # AWS service APIs every Zone can reach. One ServiceEntry per service, named
    # platform-apis-aws-<name>, scoped by hostname rather than by address because an AWS endpoint
    # resolves to addresses that change and that the cluster cannot know in advance.
    #
    # sts is not optional: a tenant ServiceAccount carries eks.amazonaws.com/role-arn and the Pod
    # itself calls STS to exchange it for credentials, so with granularEgress on and STS closed
    # every IRSA Pod fails with "no credentials". The rest are the services an application that
    # uses AWS data services normally calls. All of them authenticate with IAM, so listing them
    # here grants nothing the Zone's own IAM role does not already allow - the entry decides what
    # a Pod may connect to, not what it may do once connected.
    #
    # {region} is replaced with the region below, and a host without it is used as written. The
    # whole group is skipped while region is empty, since every default host needs it.
    #   region: "{{ .toutput.eks.region }}"
    awsApis:
      region: ""
      # Applied to every service that does not set its own ports. AWS APIs are HTTPS only, and TLS
      # is what lets Envoy route on the SNI.
      ports:
        - {number: 443, name: tls-https, protocol: TLS}
      # Drop an entry to close that service for every Zone. Hosts are the regional endpoints; an
      # SDK pinned to a global endpoint (s3.amazonaws.com, for instance) needs that host added.
      # An environment that overrides this replaces the whole list, the way Helm treats any list.
      services:
        # Credentials. Both hosts: EKS sets AWS_STS_REGIONAL_ENDPOINTS=regional, older SDKs still
        # use the global endpoint.
        - name: sts
          hosts: ["sts.{region}.amazonaws.com", "sts.amazonaws.com"]
        # Managed data services this platform provisions. The data path to an instance is opened
        # by the data subnet group above, these are the control plane APIs.
        - name: rds
          hosts: ["rds.{region}.amazonaws.com"]
        - name: elasticache
          hosts: ["elasticache.{region}.amazonaws.com"]
        - name: kafka
          hosts: ["kafka.{region}.amazonaws.com"]
        - name: mq
          hosts: ["mq.{region}.amazonaws.com"]
        # Storage and images. The wildcard hosts are the virtual-hosted bucket and registry forms;
        # Istio allows a wildcard only as the leading label.
        - name: s3
          hosts: ["s3.{region}.amazonaws.com", "*.s3.{region}.amazonaws.com"]
        - name: ecr
          hosts: ["api.ecr.{region}.amazonaws.com", "*.dkr.ecr.{region}.amazonaws.com"]
        # Secrets and configuration.
        - name: kms
          hosts: ["kms.{region}.amazonaws.com"]
        - name: secretsmanager
          hosts: ["secretsmanager.{region}.amazonaws.com"]
        - name: ssm
          hosts: ["ssm.{region}.amazonaws.com"]
        # Commonly used by applications alongside the above.
        - name: ec2
          hosts: ["ec2.{region}.amazonaws.com"]
        - name: dynamodb
          hosts: ["dynamodb.{region}.amazonaws.com"]
        - name: sqs
          hosts: ["sqs.{region}.amazonaws.com"]
        - name: sns
          hosts: ["sns.{region}.amazonaws.com"]
        - name: logs
          hosts: ["logs.{region}.amazonaws.com"]
        - name: monitoring
          hosts: ["monitoring.{region}.amazonaws.com"]
  kyvernoNamespace: kyverno
  clusterResourceWhitelist:
    - group: tenancy.entigo.com
      kind: Zone
    - group: eks.aws.upbound.io
      kind: NodeGroup

