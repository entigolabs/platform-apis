  function:
    image: ghcr.io/entigolabs/platform-apis-tenancy-fn
    tag: v0.0.0

zone:
  install: true
  package:
    image: ghcr.io/entigolabs/platform-apis-zone
    tag: v0.0.0
  environmentConfig:
    # Create the "<zone-name>-apps" Namespace that holds a Zone's ArgoCD Application and
    # ApplicationSet objects, for the app-of-apps pattern.
    createAppsNamespace: true
    # Whether outgoing rules are shared by the whole cluster or kept per Zone. This does not
    # decide whether the cluster can reach the internet, that is normally handled by a firewall
    # in front of the cluster either way.
    # false: outgoing rules are cluster-wide, an address opened by one Zone is reachable from
    # every other Zone.
    # true: each Zone has its own outgoing rules, an address opened for Zone A stays closed for
    # Zone B. Adds a proxy container to every pod in the Zone's Namespaces, so applications must
    # be restarted and every external service a Zone uses has to be listed for that Zone.
    # External hosts are opened with Istio ServiceEntry objects. With granularEgress enabled a
    # ServiceEntry only applies to the Zone whose Namespace it was created in.
    granularEgress: false
    # Zone names that keep the shared, unrestricted behaviour while granularEgress is enabled.
    granularEgressExclude: []
    # false: all Namespaces in the same Zone can reach each other.
    # true: every Namespace is isolated and needs a NetworkPolicy to accept traffic, even from
    # another Namespace in the same Zone. A Zone can override this with
    # spec.granularNamespaceNetworkPolicy.
    granularNamespaceNetworkPolicy: false
    argoCDNamespace: "argocd"
    awsProvider: "crossplane-aws"
    # User groups that get a role in every Zone. A Zone can add its own groups with
    # spec.roleMapping, which applies only to that Zone's Namespaces.
    roleMapping:
      - roleRef: maintainer
        groups: ["maintainer"]
      - roleRef: observer
        groups: ["observer"]
      - roleRef: contributor
        groups: ["contributor"]
    # Controls what ArgoCD is allowed to deploy into a Zone's Namespaces through the Zone's
    # AppProject.
    appProject:
      maintainerGroups: []
      observerGroups: []
      sourceRepos: ["*"]
      namespaceResourceBlacklist:
        - group: "*.m.upbound.io"
          kind: "*"
      namespaceResourceWhitelist: []
    cluster: eks
    dataKMSAlias: data
    securityGroup: "eks-node"
    vpc: vpc
    computeSubnetType: compute
    # Lowest Pod Security Admission level a Namespace in a Zone is allowed to run at. Every
    # Namespace is labelled with this and can only be changed to a stricter level.
    # baseline: blocks the well-known dangerous options, a team may opt into restricted.
    # restricted: containers must also run as non-root without extra privileges. Recommended for
    # production, but workloads that need root will stop starting.
    # privileged: no floor at all, not recommended.
    podSecurity: baseline
    # Cloud tags added to Zone resources such as NodeGroups.
    tags: {}
  # Copies the labels and annotations an ArgoCD Application declares under
  # spec.syncPolicy.managedNamespaceMetadata onto the Namespace that Application deploys to.
  # Labels that decide which Zone a Namespace belongs to are ignored, those can only be changed
  # with kubectl. The tenancy.entigo.com/pool label is applied, it picks one of the Zone's own
  # NodeGroups. A Pod Security label is applied, but only when it is stricter than the Zone's
  # podSecurity level.
  namespaceMetadata:
    enabled: true
    # How often every Namespace is refreshed from the Application specs. Metadata of a newly
    # created Application is applied immediately, later edits to an existing Application are
    # picked up by this refresh.
    syncInterval: 10m
  kyvernoNamespace: kyverno
  clusterResourceWhitelist:
    - group: tenancy.entigo.com
      kind: Zone
    - group: eks.aws.upbound.io
      kind: NodeGroup

networking:
  function:
    image: ghcr.io/entigolabs/platform-apis-networking-fn
    tag: v0.0.0
  environmentConfig:
    istioGateway: "istio-gateway/istio-gateway"

