{{/*
Renders one ServiceEntry opening a set of CIDRs on a set of ports.

resolution: NONE makes Envoy pass the connection through to the destination the client was
already dialling, so no instance addresses are tracked and an RDS failover cannot invalidate the
entry. spec.addresses is what scopes it - with addresses unset the entry matches every
destination on its ports - and a CIDR is only allowed there for NONE/STATIC resolution.
spec.hosts is required by the schema but matches nothing on a plain TCP connection, which carries
no SNI or Host header, so it is a fixed placeholder and must not be read as a boundary.
exportTo "*" is required: the entry has to be visible outside the Istio namespace. It does not
widen access across Zones, each Zone's Sidecar only lists its own Namespaces plus the Istio one.

cidrs accepts either a YAML list or a comma separated string, because infralib passes a subnet
output through as one comma separated value and two of them are joined with a comma. The agent
renders a Terraform list with every element quoted, so a real value arrives looking like
'"10.0.16.0/22","10.0.20.0/22"' and each segment is unquoted here, the same way aws-alb does it.
Empty segments are dropped, so a trailing comma from an unset elasticache output is harmless.

skipIfOverlaps is optional. A group naming it is dropped when any of its CIDRs also appears in
that list. It exists for the service subnets: with subnet_split_mode "default" the VPC returns
the same private subnet CIDRs for the service and compute subnets, and the compute subnets are
where Pod IPs come from, so the group would open its ports to every Pod. With "spoke" the two are
disjoint and the group is created. It is deliberately not applied to the data group, where
silently dropping the entry would break database access instead of over-opening it.
*/}}
{{- define "platform-apis.normalizeCidrs" -}}
{{- $in := . }}
{{- if kindIs "string" $in }}
{{- $in = splitList "," $in }}
{{- end }}
{{- $out := list }}
{{- range $in }}
{{- $v := . | trim | trimAll "\"" | trim }}
{{- if $v }}
{{- $out = append $out $v }}
{{- end }}
{{- end }}
{{- toJson $out }}
{{- end }}
{{- define "platform-apis.zoneServiceEntry" -}}
{{- $clean := include "platform-apis.normalizeCidrs" .cidrs | fromJsonArray }}
{{- $guard := include "platform-apis.normalizeCidrs" .skipIfOverlaps | fromJsonArray }}
{{- $overlaps := false }}
{{- range $clean }}
{{- if has . $guard }}
{{- $overlaps = true }}
{{- end }}
{{- end }}
{{- if and $clean .ports (not $overlaps) }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ .objectName }}
  namespace: {{ .istioNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  hosts:
    - {{ .objectName }}.invalid
  addresses:
    {{- range $clean }}
    - {{ . | quote }}
    {{- end }}
  exportTo:
    - "*"
  location: MESH_EXTERNAL
  resolution: NONE
  ports:
    {{- range .ports }}
    - number: {{ .number }}
      name: {{ .name }}
      protocol: {{ .protocol }}
    {{- end }}
{{- end }}
{{- end }}

{{/*
Renders one ServiceEntry opening a set of endpoints by hostname.

These are scoped by hostname rather than by address, for destinations that resolve to addresses
that change and that the cluster cannot know in advance. resolution: DNS is what makes that safe:
Envoy resolves the hosts and routes the connection on the TLS SNI, so a connection to a host that
is not listed finds no filter chain and is still blackholed. The subnet groups above cannot work
this way - a plain database connection carries no SNI - which is also why they must set addresses,
since a hostname-only entry with resolution NONE opens its ports to every destination.

{region} in a host is replaced with the region passed in. A host without it is used as written, for
the endpoints AWS does not regionalise. A host that needs a region while none is set is dropped
rather than rendered with the placeholder still in it, which would match nothing, and a service
with no hosts left is skipped, the same way a subnet group with no cidrs is.
*/}}
{{- define "platform-apis.zoneHostServiceEntry" -}}
{{- $region := .region }}
{{- $hosts := list }}
{{- range .hosts }}
{{- $host := . | trim }}
{{- if and $host (or $region (not (contains "{region}" $host))) }}
{{- $hosts = append $hosts (replace "{region}" $region $host) }}
{{- end }}
{{- end }}
{{- if and $hosts .ports }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ .objectName }}
  namespace: {{ .istioNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  hosts:
    {{- range $hosts }}
    - {{ . | quote }}
    {{- end }}
  exportTo:
    - "*"
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    {{- range .ports }}
    - number: {{ .number }}
      name: {{ .name }}
      protocol: {{ .protocol }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.zone.environmentConfig.granularEgress }}
{{- $se := .Values.zone.istioServiceEntries }}
{{- $istioNs := $se.istioNamespace }}
{{/* Every entry below lands in one Namespace, where two objects cannot share a name. The name
     each list renders carries a prefix no other list can produce - subnet-, extra-subnet-, aws-
     and extra-host- are pairwise distinct right after platform-apis- - so a name chosen in one
     list can never collide with a name from another, whatever it is called. An extraSubnets entry
     named "data" renders platform-apis-extra-subnet-data and sits next to the built-in
     platform-apis-subnet-data rather than replacing it. A name repeated within one list still
     collides, and is left to show up as the duplicate it plainly is. */}}
{{- include "platform-apis.zoneServiceEntry" (dict "objectName" "platform-apis-subnet-data" "istioNamespace" $istioNs "cidrs" $se.data.cidrs "ports" $se.data.ports) }}
{{- include "platform-apis.zoneServiceEntry" (dict "objectName" "platform-apis-subnet-service" "istioNamespace" $istioNs "cidrs" $se.service.cidrs "ports" $se.service.ports "skipIfOverlaps" $se.podCidrs) }}
{{- range $se.extraSubnets }}
{{- include "platform-apis.zoneServiceEntry" (dict "objectName" (printf "platform-apis-extra-subnet-%s" .name) "istioNamespace" $istioNs "cidrs" .cidrs "ports" .ports) }}
{{- end }}
{{/* The AWS defaults are a set of regional endpoints, so without a region none of them can be
     rendered. extraServices are whatever this environment needs and may not be regional at all,
     so they are not held back by that. */}}
{{- $region := $se.region }}
{{- if $region }}
{{- range $se.awsApis.services | default list }}
{{- include "platform-apis.zoneHostServiceEntry" (dict "objectName" (printf "platform-apis-aws-%s" .name) "istioNamespace" $istioNs "region" $region "hosts" .hosts "ports" (.ports | default $se.defaultPorts)) }}
{{- end }}
{{- end }}
{{- range $se.extraServices | default list }}
{{- include "platform-apis.zoneHostServiceEntry" (dict "objectName" (printf "platform-apis-extra-host-%s" .name) "istioNamespace" $istioNs "region" $region "hosts" .hosts "ports" (.ports | default $se.defaultPorts)) }}
{{- end }}
{{- end }}
