apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: repositories.artifact.entigo.com
spec:
  scope: Namespaced
  group: artifact.entigo.com
  names:
    kind: Repository
    plural: repositories
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: "Name of the repository, defaults to the name of the resource if not specified"
                  x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self == oldSelf
                path:
                  type: string
                  description: "Prefix path for the repository"
                  x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self == oldSelf
                lifecycleRules:
                  type: array
                  description: >-
                    ECR lifecycle policy rules, replaces the environment default when set. Each rule
                    needs one selector (tagPrefixes, tagPatterns or untagged) and one retention bound
                    (keepCount or expireAfterDays). A rule without a selector matches every image and
                    must be the last rule.
                  maxItems: 25
                  items:
                    type: object
                    properties:
                      tagPrefixes:
                        type: array
                        description: "Match images whose tag starts with one of these prefixes"
                        items:
                          type: string
                          minLength: 1
                      tagPatterns:
                        type: array
                        description: "Match images whose tag matches one of these wildcard patterns"
                        items:
                          type: string
                          minLength: 1
                      untagged:
                        type: boolean
                        description: "Match untagged images"
                      keepCount:
                        type: integer
                        description: "Expire all but this many most recently pushed matching images"
                        minimum: 1
                      expireAfterDays:
                        type: integer
                        description: "Expire matching images this many days after they were pushed"
                        minimum: 1
            status:
              type: object
              properties:
                repositoryUri:
                  type: string
                  description: "Repository URI for pulling and pushing images."
