---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: platform-apis-database
data:
  postgresqlBackends:
  - PostgreSQLOCIConfig.oci.database.entigo.com
  oci:
    providerConfig: crossplane-oracle
    cluster: oke
    vcn: vcn
    databaseSubnetType: database
    clientSecurityGroups:
    - node
    - pod
