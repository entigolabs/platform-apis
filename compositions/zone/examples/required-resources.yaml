---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx

---
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: service-params
spec:
  scheme: internal
  subnets:
    ids:
    - subnet-service-a

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abfe-app
  namespace: abfe
spec:
  ingressClassName: service
  rules:
  - host: abfe.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abfe-svc
            port:
              number: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abfe-nginx
  namespace: abfe
spec:
  ingressClassName: nginx
  rules:
  - host: abfe-nginx.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abfe-svc
            port:
              number: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: abfe-svc
  namespace: abfe
spec:
  selector:
    app: abfe-app
  ports:
  - port: 8080
    targetPort: 8081
