apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: rabbitmqbrokers.mq.entigo.com
spec:
  defaultCompositeDeletePolicy: Foreground
  group: mq.entigo.com
  scope: Namespaced
  names:
    kind: RabbitMQBroker
    plural: rabbitmqbrokers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                autoMinorVersionUpgrade:
                  default: true
                  description: Whether to automatically upgrade to new minor versions
                    of brokers as Amazon MQ makes releases available.
                  type: boolean
                brokerName:
                  type: string
                  description: Name of the broker.
                configuration:
                  description: Configuration block for broker configuration.
                  type: object
                  properties:
                    id:
                      description: Configuration ID.
                      type: string
                    idRef:
                      description: Reference to a Configuration in mq to populate id.
                      properties:
                        name:
                          description: Name of the referenced object.
                          type: string
                        namespace:
                          description: Namespace of the referenced object
                          type: string
                        policy:
                          description: Policies for referencing.
                          properties:
                            resolution:
                              default: Required
                              description: |-
                                Resolution specifies whether resolution of this reference is required.
                                The default is 'Required', which means the reconcile will fail if the
                                reference cannot be resolved. 'Optional' means this reference will be
                                a no-op if it cannot be resolved.
                              enum:
                                - Required
                                - Optional
                              type: string
                            resolve:
                              description: |-
                                Resolve specifies when this reference should be resolved. The default
                                is 'IfNotPresent', which will attempt to resolve the reference only when
                                the corresponding field is not present. Use 'Always' to resolve the
                                reference on every reconcile.
                              enum:
                                - Always
                                - IfNotPresent
                              type: string
                          type: object
                      required:
                        - name
                      type: object
                deploymentMode:
                  default: SINGLE_INSTANCE
                  description: Deployment mode of the broker. Valid values are SINGLE_INSTANCE,
                    ACTIVE_STANDBY_MULTI_AZ, and CLUSTER_MULTI_AZ. Default is SINGLE_INSTANCE.
                  type: string
                  enum:
                    - SINGLE_INSTANCE
                    - ACTIVE_STANDBY_MULTI_AZ
                    - CLUSTER_MULTI_AZ
                engineType:
                  default: RabbitMQ
                  type: string
                engineVersion:
                  default: "4.2"
                  description: Version of the broker engine.
                  type: string
                instanceType:
                  type: string
                maintenanceWindowStartTime:
                  description: Configuration block for the maintenance window start
                    time.
                  properties:
                    dayOfWeek:
                      description: Day of the week, e.g., MONDAY, TUESDAY, or WEDNESDAY.
                      type: string
                    timeOfDay:
                      description: Time, in 24-hour format, e.g., 02:00.
                      type: string
                    timeZone:
                      description: Time zone in either the Country/City format or the
                        UTC offset format, e.g., CET.
                      type: string
                  type: object
                publiclyAccessible:
                  default: false
                  type: boolean
              required:
                - instanceType
            status:
              type: object
              properties:
                amazonMQBrokerID:
                  type: string
                autoMinorVersionUpgrade:
                  type: boolean
                brokerName:
                  type: string
                configuration:
                  properties:
                    id:
                      description: Configuration ID.
                      type: string
                    revision:
                      description: Revision of the Configuration.
                      type: number
                  type: object
                deploymentMode:
                  type: string
                encryptionOptions:
                  properties:
                    kmsKeyId:
                      description: ARN of KMS CMK to use for encryption at rest. Requires
                        setting use_aws_owned_key to false. To perform drift detection
                        when AWS-managed CMKs or customer-managed CMKs are in use, this
                        value must be configured.
                      type: string
                    useAwsOwnedKey:
                      description: Whether to enable an AWS-owned KMS CMK not in your
                        account. Defaults to true. Setting to false without configuring
                        kms_key_id creates an AWS-managed CMK aliased to aws/mq in your
                        account.
                      type: boolean
                  type: object
                engineType:
                  type: string
                engineVersion:
                  type: string
                instanceType:
                  type: string
                instances:
                  items:
                    properties:
                      consoleUrl:
                        description: URL of the ActiveMQ Web Console or the RabbitMQ
                          Management UI depending on engine_type.
                        type: string
                      endpoints:
                        description: Broker's wire-level protocol endpoints referenceable.
                        items:
                          type: string
                        type: array
                      ipAddress:
                        description: IP Address of the broker.
                        type: string
                    type: object
                  type: array
                maintenanceWindowStartTime:
                  properties:
                    dayOfWeek:
                      description: Day of the week, e.g., MONDAY, TUESDAY, or WEDNESDAY.
                      type: string
                    timeOfDay:
                      description: Time, in 24-hour format, e.g., 02:00.
                      type: string
                    timeZone:
                      description: Time zone in either the Country/City format or the
                        UTC offset format, e.g., CET.
                      type: string
                  type: object
                pendingDataReplicationMode:
                  type: string
                publiclyAccessible:
                  type: boolean
                region:
                  type: string
                securityGroups:
                  items:
                    type: string
                  type: array
                storageType:
                  type: string
                subnetIds:
                  items:
                    type: string
                  type: array
          required:
            - spec
