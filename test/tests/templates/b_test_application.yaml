apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b-apps
  namespace: {{ .BApps }}
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .BApps }}
  project: {{ .B }}
  source:
    chart: platform-apis-test-b-apps
    repoURL: ghcr.io/entigolabs
    targetRevision: '*.*.*-0'
    helm:
      releaseName: platform-apis-test-b-apps
      values: |
        targetRevision: '*.*.*-0'
        prefix: '{{ .Prefix }}'
        domain: '{{ .Domain }}'
        gateway:
          name: '{{ .Gateway }}'
          namespace: '{{ .GatewayNamespace }}'
        serviceIngressClass: '{{ .ServiceIngressClass }}'
  syncPolicy: {}
