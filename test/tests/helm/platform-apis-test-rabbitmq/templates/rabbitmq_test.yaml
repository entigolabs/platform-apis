---
apiVersion: mq.entigo.com/v1alpha1
kind: RabbitMQBroker
metadata:
  name: test-rabbitmq-broker
  namespace: {{ .Release.Namespace }}
spec:
  instanceType: mq.m7g.medium
  engineVersion: "3.13"
  engineType: RabbitMQ
  deploymentMode: SINGLE_INSTANCE
  autoMinorVersionUpgrade: true
  publiclyAccessible: false
  configuration:
    data: |
      consumer_timeout = 1800000
---
apiVersion: mq.entigo.com/v1alpha1
kind: RabbitMQBroker
metadata:
  name: test-rabbitmq-public-broker
  namespace: {{ .Release.Namespace }}
spec:
  instanceType: mq.m7g.medium
  engineVersion: "4.2"
  engineType: RabbitMQ
  deploymentMode: SINGLE_INSTANCE
  autoMinorVersionUpgrade: true
  publiclyAccessible: true
  # The public broker carries the in-place Configuration data-change test, so its reboot runs beside
  # the private broker's engine upgrade instead of in front of it.
  configuration:
    data: |
      consumer_timeout = 1800000