apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b1
  namespace: {{ .Values.prefix }}b-apps
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: b1
  project: {{ .Values.prefix }}b
  source:
    chart: platform-apis-test-app
    repoURL: ghcr.io/entigolabs
    targetRevision: '{{ .Values.targetRevision }}'
    helm:
      values: |
        targetRevision: '{{ .Values.targetRevision }}'
        domain: '{{ .Values.domain }}'
        gateway:
          name: '{{ .Values.gateway.name }}'
          namespace: '{{ .Values.gateway.namespace }}'
        ingressClassName: '{{ .Values.serviceIngressClass }}'
      releaseName: b1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
