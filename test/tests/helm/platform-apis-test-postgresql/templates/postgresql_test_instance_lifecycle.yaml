apiVersion: database.entigo.com/v1alpha1
kind: PostgreSQLInstance
metadata:
  name: postgresql-instance-lifecycle
spec:
  allocatedStorage: 20
  engineVersion: "17.7"
  instanceType: db.t3.micro
  allowMajorVersionUpgrade: true
  autoMinorVersionUpgrade: true
  # No automated backups: RDS snapshots a backed-up instance before and after a major version
  # upgrade, which doubles the upgrade time this test waits on (measured 8 min vs 4 min on db.t3.micro).
  backupRetentionPeriod: 0
  deletionProtection: false
  multiAZ: false